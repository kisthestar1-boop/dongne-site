<!doctype html>
<html lang="ko"><head><meta charset="utf-8">

<title>여섯 번째 성주 · THE SIXTH LORD</title>
<style>
:root{--ink:#EDE6D6;--sub:#A9A08C;--gold:#E9C46A;--blood:#C2382E;--moon:#DCE3EA;--stone:#3A3631}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;overflow:hidden;background:#07080C;color:var(--ink);font-family:"Noto Serif KR","Nanum Myeongjo","Apple SD Gothic Neo","Malgun Gothic",serif}
button{font-family:inherit;cursor:pointer}
#sky{position:fixed;inset:0;background:radial-gradient(120% 80% at 50% 0%,#1B1E2B 0%,#0C0D14 55%,#050507 100%)}
#sky .fog{position:absolute;left:0;right:0;bottom:0;height:45%;background:linear-gradient(transparent,rgba(30,26,22,.85))}
#moon{position:absolute;left:50%;top:6%;width:min(46vh,62vw);transform:translateX(-50%);filter:drop-shadow(0 0 40px rgba(220,227,234,.25));transition:filter 1.2s}
body.lit #moon{filter:drop-shadow(0 0 70px rgba(220,227,234,.45)) drop-shadow(0 0 30px rgba(194,56,46,.35))}
.shard{position:absolute;top:-4%;width:6px;height:12px;background:linear-gradient(#fff,#9FB0C2);clip-path:polygon(50% 0,100% 40%,60% 100%,0 60%);opacity:.7;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(110vh) rotate(260deg);opacity:0}}
#wall{position:absolute;left:0;right:0;bottom:0;height:34%;background:linear-gradient(#17151A,#0B0A0C);clip-path:polygon(0 30%,6% 30%,6% 18%,10% 18%,10% 30%,22% 30%,22% 22%,26% 22%,26% 30%,40% 30%,40% 26%,60% 26%,60% 30%,74% 30%,74% 22%,78% 22%,78% 30%,90% 30%,90% 18%,94% 18%,94% 30%,100% 30%,100% 100%,0 100%)}
#tower{position:absolute;right:7%;bottom:34%;width:7vh;height:30vh;background:#0F0E11;clip-path:polygon(20% 100%,25% 12%,0 12%,0 0,100% 0,100% 12%,75% 12%,80% 100%)}
#tower i{position:absolute;left:50%;top:4%;width:2.2vh;height:2.2vh;transform:translateX(-50%);border-radius:50%;background:#FF8A3D;box-shadow:0 0 18px 8px rgba(255,120,40,.45)}
.scr{position:fixed;inset:0;display:none;flex-direction:column;align-items:center}
.scr.on{display:flex}
/* 타이틀 */
#title{justify-content:flex-end;padding-bottom:9vh;cursor:pointer}
.logo{text-align:center;text-shadow:0 4px 18px #000}
.logo h1{font-size:clamp(34px,8vh,66px);letter-spacing:.12em;font-weight:900;color:#F1ECE2}
.logo h2{font-family:Georgia,"Times New Roman",serif;font-size:clamp(14px,2.6vh,22px);letter-spacing:.55em;color:var(--moon);margin-top:2px;padding-left:.55em}
.logo p{font-size:clamp(13px,2.2vh,17px);color:#D98A80;margin-top:10px;letter-spacing:.2em}
.tap{margin-top:5vh;font-size:15px;color:var(--sub);animation:breath 2.8s ease-in-out infinite}
@keyframes breath{50%{opacity:.35}}
/* 메인 메뉴 */
#menu{justify-content:flex-end}
.bar{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;font-family:system-ui,"Apple SD Gothic Neo",sans-serif;font-size:14px;font-weight:800;z-index:3}
.bar .t{color:#F1ECE2;letter-spacing:.08em}.bar .t small{color:var(--sub);font-weight:500;margin-left:6px;letter-spacing:0}
.bar .res span{background:rgba(0,0,0,.45);border:1px solid #4A4438;border-radius:20px;padding:5px 11px;margin-left:6px}
.banners{position:absolute;top:44%;left:0;right:0;display:flex;justify-content:space-between;padding:0 3%;pointer-events:none}
.bn{width:clamp(34px,6vh,58px);height:clamp(70px,13vh,120px);clip-path:polygon(0 0,100% 0,100% 100%,50% 84%,0 100%);display:flex;align-items:flex-start;justify-content:center;padding-top:14px;align-self:flex-start;font-size:clamp(18px,3vh,28px);box-shadow:inset 0 0 18px rgba(0,0,0,.6);opacity:.9}
.bn:nth-child(3){visibility:hidden}
.altar{position:relative;width:min(92vw,560px);height:min(46vh,340px);margin-bottom:12vh;display:flex;align-items:center;justify-content:center}
.altar::before{content:"";position:absolute;left:4%;right:4%;bottom:-6%;height:46%;border-radius:50%;background:radial-gradient(closest-side,#5A544B,#2C2925 70%,transparent);box-shadow:0 0 60px rgba(220,227,234,.12)}
.sh{position:relative;border:0;color:#1A1714;font-weight:900;letter-spacing:.15em;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:transform .2s,filter .2s;filter:drop-shadow(0 0 10px rgba(220,227,234,.35))}
.sh:hover{transform:translateY(-4px);filter:drop-shadow(0 0 22px rgba(255,255,255,.7))}
.sh:active{transform:translateY(1px) scale(.98)}
.sh small{font-family:system-ui,sans-serif;font-size:11px;letter-spacing:0;font-weight:700;color:#4B463E;margin-top:2px}
.sh.big{width:min(44vw,230px);height:min(30vh,210px);font-size:clamp(20px,4vh,32px);background:linear-gradient(160deg,#FFFFFF,#C9D4DF 45%,#8C9AAA);clip-path:polygon(50% 0,92% 30%,80% 100%,20% 100%,8% 30%);z-index:2}
.sh.big::after{content:"";position:absolute;left:46%;top:8%;width:3px;height:70%;background:linear-gradient(var(--blood),transparent);transform:rotate(14deg);opacity:.8}
.sh.sm{width:min(26vw,140px);height:min(17vh,120px);font-size:clamp(14px,2.4vh,19px);background:linear-gradient(160deg,#EEF2F6,#A9B6C3 60%,#768596);clip-path:polygon(50% 0,100% 35%,84% 100%,16% 100%,0 35%);margin-top:12%}
.corner{position:absolute;bottom:3vh;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;color:var(--ink);font-size:13px;font-weight:800;font-family:system-ui,sans-serif}
.corner i{font-style:normal;width:62px;height:62px;border-radius:14px;background:linear-gradient(#4A3524,#2A1D13);border:2px solid #7A5A36;display:flex;align-items:center;justify-content:center;font-size:30px;box-shadow:0 4px 0 #1A120B}
.corner:hover i{border-color:var(--gold)}
.corner.l{left:4%}.corner.r{right:4%}
.dot{position:absolute;top:-4px;right:-4px;width:14px;height:14px;border-radius:50%;background:var(--blood);border:2px solid #fff}
/* 공통 패널 */
.pan{position:absolute;inset:0;background:rgba(8,8,11,.97);display:flex;flex-direction:column;font-family:system-ui,"Apple SD Gothic Neo",sans-serif;z-index:5}
.pan .hd{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid #2E2A24}
.pan .hd b{font-family:"Noto Serif KR",serif;font-size:18px;letter-spacing:.06em}
.pan .hd small{color:var(--sub)}
.x{margin-left:auto;background:#1F1C18;border:1px solid #4A4438;color:var(--ink);border-radius:10px;padding:7px 12px;font-weight:800}
.pan .bd{flex:1;overflow:auto;padding:14px 16px 28px}
/* 원정 */
.path{display:flex;flex-direction:column;gap:10px;max-width:640px;margin:0 auto}
.hs{display:flex;gap:12px;align-items:center;border-radius:14px;padding:12px;background:linear-gradient(90deg,var(--c) -60%,#141217 55%);border:1px solid #3A352D;cursor:pointer;transition:transform .15s}
.hs:hover{transform:translateX(4px)}
.hs.lock{filter:grayscale(1) brightness(.5);cursor:default}
.hs .ic{width:54px;height:54px;border-radius:50%;background:rgba(0,0,0,.45);border:2px solid var(--c);display:flex;align-items:center;justify-content:center;font-size:28px;flex:none}
.hs b{font-size:16px}.hs .m{font-size:12px;color:#D9CFBC;font-style:italic;margin-top:2px}.hs .s{font-size:11px;color:var(--sub);margin-top:3px}
.hs .st{margin-left:auto;font-size:12px;font-weight:800;white-space:nowrap}
/* 수집 */
.hg{margin:14px 0 6px;font-weight:900;font-size:14px;display:flex;align-items:center;gap:8px}
.hg i{font-style:normal;color:var(--sub);font-weight:500;font-size:12px}
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.cd{position:relative;aspect-ratio:3/4.2;border-radius:12px;background:linear-gradient(170deg,#2B2620,#14110E);border:2px solid var(--rc);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;padding:8px 4px}
.cd .e{font-size:40px}.cd .n{font-size:12px;font-weight:900;text-align:center}.cd .l{font-size:11px;color:var(--gold)}
.cd .k{position:absolute;top:6px;left:6px;width:22px;height:22px;border-radius:50%;background:#2F6BE0;font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center}
.cd.no{filter:grayscale(1) brightness(.45)}
.lore{max-width:520px;margin:0 auto;text-align:center}
.lore .e{font-size:72px}.lore h3{font-family:"Noto Serif KR",serif;font-size:22px;margin:6px 0 2px}
.lore .tg{font-size:12px;color:var(--sub)}
.lore p{text-align:left;font-size:14px;line-height:1.75;color:#DCD3C2;margin-top:12px}
.lore .q{font-style:italic;color:var(--gold);text-align:center}
.stat{display:flex;justify-content:center;gap:8px;margin-top:10px;font-size:13px;font-weight:800}
.stat span{background:#1F1C18;border-radius:10px;padding:5px 10px}
/* 상점 */
.pk{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:4vh}
.pack{width:150px;height:210px;border-radius:14px;background:linear-gradient(160deg,#E4EAF0,#7E8D9E);clip-path:polygon(50% 0,100% 18%,100% 100%,0 100%,0 18%);display:flex;align-items:center;justify-content:center;font-size:56px;cursor:pointer;filter:drop-shadow(0 0 22px rgba(220,227,234,.35));transition:transform .2s}
.pack:hover{transform:translateY(-6px)}
.buy{background:linear-gradient(#F3D27A,#C99A2E);border:0;border-radius:12px;padding:12px 22px;font-weight:900;font-size:15px;color:#2A1D0A;box-shadow:0 4px 0 #7A5A16}
.buy:disabled{filter:grayscale(1) brightness(.6)}
.rv{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.flip{width:118px;height:166px;perspective:600px;cursor:pointer}
.flip .in{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;border-radius:12px;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.flip .b{background:linear-gradient(160deg,#3B3A44,#15141A);border:2px solid #6A6F7C;font-size:40px}
.flip .f{transform:rotateY(180deg);background:linear-gradient(170deg,#2B2620,#14110E);border:3px solid var(--rc);box-shadow:0 0 24px var(--rc)}
.flip .f .e{font-size:44px}.flip .f .n{font-size:12px;font-weight:900}.flip .f .t{font-size:11px;color:var(--gold)}
/* 대화 */
#dlg{position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.72);display:none;align-items:flex-end;justify-content:center;padding:0 12px 6vh;font-family:system-ui,sans-serif}
#dlg.on{display:flex}
#dlg .bx{width:min(640px,96vw);background:linear-gradient(#1D1A16,#0F0D0B);border:1px solid #6A5A3A;border-radius:16px;padding:16px 18px;display:flex;gap:14px;align-items:flex-start}
#dlg .pt{font-size:54px;flex:none}
#dlg .who{font-weight:900;color:var(--gold);font-size:14px}
#dlg .tx{font-size:15px;line-height:1.7;margin-top:4px;color:#E8E0CF;min-height:3.4em}
#dlg .row{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
.gbtn{background:linear-gradient(#F3D27A,#C99A2E);border:0;border-radius:10px;padding:9px 16px;font-weight:900;color:#2A1D0A}
.sbtn{background:#262219;border:1px solid #5A4E38;border-radius:10px;padding:9px 14px;font-weight:800;color:var(--ink)}
#toast{position:fixed;left:50%;top:14%;transform:translateX(-50%);background:rgba(10,9,8,.92);border:1px solid var(--gold);border-radius:12px;padding:9px 16px;font-family:system-ui,sans-serif;font-weight:800;font-size:14px;z-index:20;opacity:0;transition:opacity .3s;pointer-events:none}
.q3{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.qi{display:flex;align-items:center;gap:12px;background:#17150F;border:1px solid #3A352D;border-radius:12px;padding:12px}
.qi b{font-size:14px}.qi small{display:block;color:var(--sub);font-size:12px;margin-top:2px}
.qi .pg{margin-left:auto;font-weight:900;font-size:13px;white-space:nowrap}
@media (max-width:600px){.banners{top:38%}.bn{opacity:.6}.corner i{width:52px;height:52px;font-size:26px}.altar{margin-bottom:15vh}}
body.art #moon,body.art #wall,body.art #tower,body.art .banners{display:none}body.art #sky .fog{height:30%;background:linear-gradient(transparent,rgba(5,5,8,.7))}body.art .altar::before{opacity:.35}

<script>
const $=s=>document.querySelector(s),R=Math.random;
/* ===== 세계: 다섯 가문 ===== */
const HOUSES=[
 {id:"green",n:"그린홀드",ic:"🌲",c:"#3E7A4A",m:"화살은 잊지 않는다",lord:["🐺","늑대 성주 그레이"],cards:["fox","wolf","owl"],
  say:["여섯 번째 성주라고? 가문도 없는 자가 성을 가졌다니.","화살은 잊지 않는다. 분열의 밤에 누가 먼저 쐈는지도."],win:"…좋다. 그린홀드는 너를 기억하겠다."},
 {id:"mud",n:"머드리버",ic:"🐊",c:"#2F6E6A",m:"기다리는 자가 살아남는다",lord:["🐊","악어 성주 녹스"],cards:["croc","turtle","snake"],
  say:["서두르지 마라, 젊은 성주. 늪은 서두르는 자부터 삼킨다.","나는 누구 편도 아니다. 그러니 오늘은 네 적이지."],win:"흥… 조각을 팔 상대가 하나 늘었군."},
 {id:"stone",n:"스톤팡",ic:"⛰",c:"#7A5A3A",m:"무너지는 것은 성벽뿐",lord:["🐻","곰 성주 모쿠"],cards:["bear","boar","rhino"],
  say:["힘이 곧 정의다. 말은 필요 없다.","네 성벽이 얼마나 버티는지 보자."],win:"무너지는 것은 성벽뿐… 내가 아니다. 다음엔 다르다."},
 {id:"sun",n:"썬메인",ic:"🦁",c:"#B8862E",m:"왕좌는 빈 적이 없다",lord:["🦁","사자 성주 아즈란"],cards:["lion","panther","elephant"],
  say:["왕좌는 빈 적이 없다. 언제나 내가 앉아 있었으니까.","무릎을 꿇으면 목숨은 살려 주마."],win:"…찬탈자라고 부르는 자들이 또 하나 늘었군."},
 {id:"ever",n:"에버플레임",ic:"🔥",c:"#C2562E",m:"불은 꺼지지 않는다",lord:["🐲","용 성주 이그니스"],cards:["hawk","phoenix","dragon"],

];
const HOME={id:"none",n:"가문 없음",ic:"🦊",c:"#6A6F7C"};
/* ===== 영웅 16 · 이야기 2문단(과거 → 지금) ===== */
const RAR=[["일반","#9AA3B5"],["희귀","#4FA3FF"],["영웅","#B36BFF"],["전설","#FFB13D"]];
const CARDS={
 fox:["🦊","여우 궁수",0,2,"궁수","green","분열의 밤, 은빛 숲에서 첫 화살을 쏜 것이 여우였다는 소문이 있다. 여우 궁수들은 그 소문을 한 번도 부정한 적이 없다.","지금은 그린홀드 성벽 위에서 매일 밤 깨진 달을 겨눈다. \"언젠가 저 조각 하나는 우리 몫이다.\""],
 wolf:["🐺","늑대 사냥꾼",0,2,"추격","green","그레이의 친위대. 혼자서는 약하지만 무리 지어 다니면 곰도 물러선다.","잿빛 시대에 굶주린 무리를 먹여 살리려고, 다른 가문의 보급로를 사냥하기 시작했다."],
 owl:["🦉","부엉이 마법사",1,4,"광역 마법","green","은달 시대 왕궁의 별점술사였다. 달이 깨진 밤, 그 장면을 가장 가까이서 본 유일한 증인이다.","달 조각을 너무 많이 써서 자기 이름조차 기억하지 못한다. 그래도 그날 밤의 진실만은 잊지 않으려고 깃털에 새겨 둔다."],
 bear:["🐻","곰 거인",1,5,"탱커","stone","스톤팡의 장군. 바위산 성문을 혼자 사흘 동안 지켜 낸 '사흘의 문' 전투로 이름을 떨쳤다.","모쿠의 명령으로 달 조각을 녹여 만든 도끼를 들었다. 그 도끼를 쥘 때마다 고향의 냄새가 하나씩 기억에서 사라진다."],
 boar:["🐗","멧돼지 돌격병",0,3,"돌격","stone","생각보다 먼저 몸이 나간다. 스톤팡에서 가장 많이 죽고 가장 많이 다시 태어나는 병사들이다.","\"무너지는 것은 성벽뿐.\" 그들은 이 말을 문 대신 머리로 증명한다."],
 rhino:["🦏","코뿔소 파괴자",2,5,"공성","stone","은달 시대에는 왕의 성을 짓던 석공들이었다. 짓던 손이 이제는 부순다.","다섯 가문 성벽의 약점을 모두 알고 있다. 그래서 모두가 그를 원하고, 모두가 그를 두려워한다."],
 croc:["🐊","악어 투사",1,4,"수호","mud","머드리버 투기장의 챔피언. 지는 법을 모른다기보다, 질 때까지 기다리지 않는다.","녹스가 몰래 판 달 조각 값을 받으러 다른 가문에 드나든다. 돌아올 때마다 상처가 하나씩 늘어 있다."],
 turtle:["🐢","거북 수호병",0,3,"도발","mud","백 년을 산 거북은 은달 시대를 기억하는 몇 안 되는 존재다.","\"기다리는 자가 살아남는다.\" 그는 이번 전쟁도 끝까지 기다려 볼 생각이다."],
 snake:["🐍","독사 암살자",1,2,"독","mud","분열의 밤, 썬메인 왕의 막내를 지키던 호위였다. 그날 밤 그 호위는 막내를 지키지 못했다.","지금은 누구의 의뢰든 받는다. 단 하나, 사자 가문의 일만은 거절한다. 이유는 말하지 않는다."],
 lion:["🦁","사자왕",3,6,"지휘","sun","썬메인의 왕 아즈란. 은달 왕의 막내라고 주장하지만, 그날 밤 막내는 죽었다는 증언이 있다.","\"왕좌는 빈 적이 없다.\" 그가 일어서면 모든 아군이 한 걸음 더 나아간다."],
 panther:["🐆","흑표범 자객",2,4,"은신","sun","사막의 그림자. 썬메인의 적이 사라질 때마다 모래 위에 검은 발자국만 남는다.","아즈란의 비밀을 알고 있는 유일한 자객. 그래서 아즈란은 그를 가장 아끼고, 가장 경계한다."],
 elephant:["🐘","코끼리 전차",2,6,"성장","sun","은달 시대 왕실 행렬의 선두를 걷던 코끼리 기사단.","왕이 사라진 뒤 아즈란에게 충성을 맹세했다. 싸울수록 갑옷 위에 쌓이는 모래만큼 단단해진다."],
 hawk:["🦅","매 척후병",0,1,"돌진","ever","하늘섬에서 가장 먼저 날아오르는 눈. 다섯 가문의 성 위를 모두 날아 본 유일한 새다.","에버플레임과 그림자의 밀서를 나르고 있다는 소문이 돈다. 매는 아무 말도 하지 않는다."],
 phoenix:["🔥","불사조 현자",3,5,"부활","ever","몇 번을 죽고 다시 태어났는지 아무도 모른다. 다시 태어날 때마다 기억 하나를 잃는다.","그래서 그는 자신이 은달 시대의 누구였는지 모른다. 다만 달을 볼 때마다 눈물이 난다."],
 dragon:["🐲","용왕",3,7,"전설","ever","에버플레임의 성주 이그니스. 분열의 밤에 깨진 달의 가장 큰 조각을 삼켰다는 전설이 있다.","\"달이 아니라 불이 새 질서다.\" 그 불이 그림자와 손을 잡는 순간, 숲이 모두 탈 것이다."],
 bunny:["🐇","토끼 치유사",1,2,"치유","none","어느 가문에도 속하지 않은 떠돌이 치유사. 달 조각 없이 상처를 고치는 법을 아는 마지막 존재다.","여섯 번째 성주인 당신의 성에 제일 먼저 찾아왔다. \"기억을 잃지 않고도 이길 수 있어요.\""]
};
const IDS=Object.keys(CARDS);const houseOf=id=>HOUSES.find(h=>h.id===CARDS[id][5])||HOME;
/* ===== 저장 (기존 영웅 본부와 공유) ===== */
const KEY="beastlord_v1";let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(_){}
if(!S||!S.h)S={nm:"여섯 번째 성주",gold:300,tro:0,h:{fox:{lv:1,sh:0,tr:0},boar:{lv:1,sh:0,tr:0},turtle:{lv:1,sh:0,tr:0},wolf:{lv:1,sh:0,tr:0},hawk:{lv:1,sh:0,tr:0},bunny:{lv:1,sh:0,tr:0}},deck:[],chests:[],log:[]};
S.camp=S.camp||{};S.q=S.q||{};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(_){}};
const toast=m=>{const t=$("#toast");t.textContent=m;t.style.opacity=1;clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.opacity=0,1600)};
/* 소리 (조용하게) */
let AC;const tone=(f,d,ty,v)=>{try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=ty||"sine";o.frequency.value=f;g.gain.setValueAtTime(v||.06,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(_){}};
const chime=()=>[392,523,659].forEach((f,i)=>setTimeout(()=>tone(f,.5,"sine",.05),i*110));
const click=()=>tone(330,.12,"triangle",.05);
/* 떨어지는 달 조각 (천천히) */
(()=>{const w=$("#shards");for(let i=0;i<14;i++){const s=document.createElement("i");s.className="shard";s.style.left=(30+R()*40)+"%";s.style.animationDuration=(10+R()*10)+"s";s.style.animationDelay=(-R()*18)+"s";s.style.transform=`scale(${.6+R()})`;w.appendChild(s)}})();
$("#banners").innerHTML=[HOUSES[0],HOUSES[1],{c:"transparent",ic:""},HOUSES[3],HOUSES[2]].map(h=>`<div class="bn" style="background:linear-gradient(${h.c},#0D0C0E)"><span style="position:relative;z-index:1;font-family:'Noto Color Emoji','Apple Color Emoji','Segoe UI Emoji',sans-serif;filter:drop-shadow(0 2px 3px #000)">${h.ic}</span></div>`).join("");
/* ===== 화면 이동 ===== */
function show(id){document.querySelectorAll(".scr").forEach(s=>s.classList.toggle("on",s.id===id));$("#panel").innerHTML="";if(id==="menu")topBar()}
function topBar(){$("#tro").textContent=S.tro||0;$("#gld").textContent=S.gold||0;$("#qdot").style.display=quests().some(q=>q.done&&!S.q[q.id+day()])?"block":"none"}
$("#title").onclick=()=>{document.body.classList.add("lit");chime();show("menu");if(!S.seenIntro){S.seenIntro=1;save();talk([["🐇","토끼 치유사","성주님, 오셨군요. 백 년째 아침이 오지 않는 잿빛 시대예요."],["🐇","토끼 치유사","다섯 가문이 깨진 달 조각을 두고 서로를 의심하고 있어요. 조각을 쓰면 영웅이 깨어나지만… 쓸 때마다 기억 하나가 지워져요."],["🐇","토끼 치유사","가문 없는 여섯 번째 성주님. 먼저 '원정'에서 그린홀드부터 찾아가 봐요."]])}};
document.addEventListener("click",e=>{const b=e.target.closest("[data-go]");if(!b)return;click();({camp,fight,coll,shop,quest})[b.dataset.go]()});
function panel(t,sub,html){$("#panel").innerHTML=`<div class="pan"><div class="hd"><b>${t}</b><small>${sub||""}</small><button class="x" id="px">← 돌아가기</button></div><div class="bd">${html}</div></div>`;$("#px").onclick=()=>{click();show("menu")}}
/* 대화 */
function talk(lines,done,btns){let i=0;const d=$("#dlg");d.classList.add("on");
 const step=()=>{const [pt,who,tx]=lines[i];$("#dpt").textContent=pt;$("#dwho").textContent=who;$("#dtx").textContent=tx;const last=i===lines.length-1;
  $("#drow").innerHTML=last&&btns?btns:`<button class="gbtn" id="dn">${last?"확인":"다음 ▸"}</button>`;
  const dn=$("#dn");if(dn)dn.onclick=()=>{click();if(last){d.classList.remove("on");done&&done()}else{i++;step()}};
  d.querySelectorAll("[data-b]").forEach(x=>x.onclick=()=>{click();d.classList.remove("on");done&&done(x.dataset.b)})};step()}
/* ===== 원정: 다섯 가문 ===== */
function camp(){const beat=k=>S.camp[k];
 panel("원정","다섯 가문을 차례로 꺾고 왕좌로",`<div class="path">${HOUSES.map((h,i)=>{const open=i===0||beat(HOUSES[i-1].id);return `<div class="hs ${open?"":"lock"}" style="--c:${h.c}" data-h="${h.id}"><div class="ic">${h.lord[0]}</div><div><b>${i+1}. ${h.n} <span style="font-size:13px">${h.ic}</span></b><div class="m">"${h.m}"</div><div class="s">${h.lord[1]} · ${h.cards.map(c=>CARDS[c][0]).join(" ")}</div></div><div class="st">${beat(h.id)?"✅ 승리":open?"⚔ 도전":"🔒"}</div></div>`}).join("")}
 <div class="hs lock" style="--c:#3A3A48;margin-top:6px"><div class="ic">👁</div><div><b>??? 그림자</b><div class="m">"…"</div><div class="s">다섯 가문을 모두 꺾으면 열려요</div></div><div class="st">🔒</div></div></div>`);
 document.querySelectorAll(".hs[data-h]").forEach(x=>x.onclick=()=>{if(x.classList.contains("lock")){toast("앞 가문을 먼저 꺾어야 해요");return}const h=HOUSES.find(z=>z.id===x.dataset.h);
  talk(h.say.map(t=>[h.lord[0],h.lord[1],t]),b=>{if(b==="go")go(h.id)},`<button class="sbtn" data-b="no">나중에</button><button class="gbtn" data-b="go">⚔ 대결 시작</button>`)})}
function go(hid){location.href="sixthfight.html?foe="+hid}
function fight(){const open=HOUSES.filter((h,i)=>i===0||S.camp[HOUSES[i-1].id]);const h=open[Math.floor(R()*open.length)];toast(`${h.ic} ${h.n}의 ${h.lord[1]}와 대결!`);setTimeout(()=>go(h.id),700)}
/* ===== 수집 ===== */
function coll(){const own=id=>S.h[id];
 const grp=(h,ids)=>`<div class="hg" style="color:${h.c==="#6A6F7C"?"#C9CED8":h.c}">${h.ic} ${h.n} <i>${h.m?'"'+h.m+'"':"당신의 성"}</i></div><div class="cg">${ids.map(id=>{const c=CARDS[id],o=own(id);return `<div class="cd ${o?"":"no"}" style="--rc:${RAR[c[2]][1]}" data-c="${id}"><span class="k">${c[3]}</span><div class="e">${c[0]}</div><div class="n">${c[1]}</div><div class="l">${o?"Lv "+o.lv+(o.sh?" · 조각 "+o.sh:""):"미보유"}</div></div>`}).join("")}</div>`;
 const n=IDS.filter(own).length;
 panel("수집",`영웅 ${n} / ${IDS.length} · 누르면 이야기`,grp(HOME,["bunny"])+HOUSES.map(h=>grp(h,h.cards)).join(""));
 document.querySelectorAll(".cd").forEach(x=>x.onclick=()=>{click();lore(x.dataset.c)})}
function lore(id){const c=CARDS[id],h=houseOf(id),o=S.h[id];
 panel(c[1],h.n,`<div class="lore"><div class="e">${c[0]}</div><h3>${c[1]}</h3><div class="tg" style="color:${RAR[c[2]][1]}">${RAR[c[2]][0]} · ${h.ic} ${h.n} · ${c[4]}</div><div class="stat"><span>💎 비용 ${c[3]}</span><span>${o?"⭐ Lv "+o.lv:"🔒 미보유"}</span></div><p>${c[6]}</p><p>${c[7]}</p>${h.m?`<p class="q">"${h.m}"</p>`:""}</div>`);
 $("#px").onclick=()=>{click();coll()}}
/* ===== 달 조각 상점: 3장 뽑기 ===== */
const PRICE=100;
function shop(){panel("달 조각 상점","조각 하나에 영웅 3명이 깨어나요",`<div class="pk"><div class="pack" id="pack">🌑</div><button class="buy" id="buy" ${S.gold<PRICE?"disabled":""}>🪙 ${PRICE} · 달 조각 열기</button><small style="color:#A9A08C">가진 금화 ${S.gold} · 같은 영웅이 나오면 조각이 쌓여 레벨업 재료가 돼요</small><div class="rv" id="rv"></div></div>`);
 const open=()=>{if(S.gold<PRICE){toast("금화가 모자라요 · 대결에서 이기면 얻어요");return}S.gold-=PRICE;
  const roll=()=>{const r=R();const rr=r<.04?3:r<.16?2:r<.45?1:0;const pool=IDS.filter(i=>CARDS[i][2]===rr);return pool[Math.floor(R()*pool.length)]};
  const got=[roll(),roll(),roll()];got.forEach(id=>{const o=S.h[id];if(o)o.sh=(o.sh||0)+1;else S.h[id]={lv:1,sh:0,tr:0,nw:1}});save();
  $("#rv").innerHTML=got.map(id=>{const c=CARDS[id];return `<div class="flip" style="--rc:${RAR[c[2]][1]}"><div class="in"><div class="b">🌑</div><div class="f"><div class="e">${c[0]}</div><div class="n">${c[1]}</div><div class="t">${RAR[c[2]][0]}${S.h[id].nw?" · NEW!":" · 조각 +1"}</div></div></div></div>`}).join("");
  got.forEach(id=>delete S.h[id].nw);save();$("#buy").disabled=S.gold<PRICE;$("#buy").nextElementSibling.textContent=`가진 금화 ${S.gold} · 카드를 눌러 뒤집어요`;
  document.querySelectorAll(".flip").forEach((f,i)=>f.onclick=()=>{if(f.classList.contains("on"))return;f.classList.add("on");const r=IDS.indexOf(got[i])>=0?CARDS[got[i]][2]:0;tone(440+r*110,.35,"sine",.06);if(r>=2)setTimeout(chime,250)})};
 $("#buy").onclick=open;$("#pack").onclick=open}
/* ===== 임무 ===== */
function day(){return new Date().toISOString().slice(0,10)}
function quests(){const L=(S.log||[]).filter(x=>new Date(x.t||0).toISOString().slice(0,10)===day());const w=L.filter(x=>x.w).length;
 return [{id:"p1",n:"오늘 대결 1판",d:"이기든 지든 한 판",need:1,cur:L.length,gold:30},{id:"w1",n:"오늘 1승",d:"어느 가문이든 꺾기",need:1,cur:w,gold:50},{id:"w3",n:"오늘 3승",d:"성주의 위엄",need:3,cur:w,gold:100}].map(q=>({...q,done:q.cur>=q.need}))}
function quest(){const Q=quests();panel("임무","매일 새로 바뀌어요",`<div class="q3">${Q.map(q=>{const got=S.q[q.id+day()];return `<div class="qi"><div style="font-size:28px">${got?"✅":q.done?"🎁":"📜"}</div><div><b>${q.n}</b><small>${q.d} · 보상 🪙 ${q.gold}</small></div><div class="pg">${got?"받음":q.done?`<button class="gbtn" data-q="${q.id}">받기</button>`:`${Math.min(q.cur,q.need)} / ${q.need}`}</div></div>`}).join("")}</div>`);
 document.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{const q=Q.find(x=>x.id===b.dataset.q);S.q[q.id+day()]=1;S.gold+=q.gold;save();chime();toast(`🪙 금화 +${q.gold}`);quest()})}
/* 대결에서 돌아왔을 때 */
(()=>{const p=new URLSearchParams(location.search);if(p.get("back")){show("menu");document.body.classList.add("lit");const h=HOUSES.find(x=>x.id===p.get("foe"));
 if(p.get("back")==="win"&&h){talk([[h.lord[0],h.lord[1],h.win]],()=>{history.replaceState(null,"","sixthlord.html")})}else history.replaceState(null,"","sixthlord.html")}})();
window.__sl={S:()=>S,HOUSES,CARDS};
</script></body></html>
