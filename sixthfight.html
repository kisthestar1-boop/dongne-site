<style>

<div id="app">
 <div id="hud"><div class="cs"><span class="f">🦊</span><div class="bx"><b>여섯 번째 성주</b><div class="hpb"><i id="hp0" style="width:100%"></i></div></div></div>

 <div id="wrap"><canvas id="cv"></canvas><a id="back" href="sixthlord.html">← 성으로</a></div>

</div>

<script>
const $=s=>document.querySelector(s),R=Math.random,QS=new URLSearchParams(location.search),AUTO=QS.get("auto")==="1";
/* ===== 데이터 ===== */
// id: 이모지, 이름, 등급, 엘릭서(값 기준), hp, 공격, 사거리, 속도, 공속, 특수, 한 번에 나오는 수
const U={
 fox:["🦊","여우 궁수",0,3,70,13,120,42,1.0,"",2],
 wolf:["🐺","늑대 사냥꾼",0,3,95,15,22,58,0.9,"pack",2],
 owl:["🦉","부엉이 마법사",1,5,75,20,130,38,1.6,"splash",1],
 bear:["🐻","곰 거인",1,6,480,28,24,30,1.4,"",1],
 boar:["🐗","멧돼지 돌격병",0,3,130,16,22,62,1.0,"charge",1],
 rhino:["🦏","코뿔소 파괴자",2,6,520,34,26,34,1.5,"siege",1],
 croc:["🐊","악어 투사",1,5,260,24,24,36,1.2,"splash",1],
 turtle:["🐢","거북 수호병",0,4,320,12,22,28,1.2,"",1],
 snake:["🐍","독사 암살자",1,3,55,12,22,55,0.8,"poison",2],
 lion:["🦁","사자왕",3,7,560,44,26,40,1.2,"aura",1],
 panther:["🐆","흑표범 자객",2,4,85,32,22,64,0.8,"assassin",1],
 elephant:["🐘","코끼리 전차",2,7,720,30,26,26,1.5,"",1],
 hawk:["🦅","매 척후병",0,2,45,9,22,80,0.6,"",2],
 phoenix:["🔥","불사조 현자",3,6,150,38,120,40,1.4,"splash rebirth",1],
 dragon:["🐲","용왕",3,8,640,52,130,30,1.8,"splash",1],
 bunny:["🐇","토끼 치유사",1,4,60,0,100,40,1.5,"heal",1]
};
const RC=["#9AA3B5","#4FA3FF","#B36BFF","#FFB13D"];
const IMG={};Object.keys(U).forEach(k=>{const i=new Image();i.src="store/heroes/"+k+".jpg";IMG[k]=i});const FIELD=new Image();FIELD.src="store/sixth_field.jpg";const ok=i=>i&&i.complete&&i.naturalWidth>0;
const LORDS={green:["🐺","늑대 성주 그레이",["fox","wolf","owl"],0,"화살은 잊지 않는다"],mud:["🐊","악어 성주 녹스",["croc","turtle","snake"],1,"기다리는 자가 살아남는다"],stone:["🐻","곰 성주 모쿠",["boar","bear","rhino"],2,"무너지는 것은 성벽뿐"],sun:["🦁","사자 성주 아즈란",["panther","elephant","lion"],3,"왕좌는 빈 적이 없다"],ever:["🐲","용 성주 이그니스",["hawk","phoenix","dragon"],4,"불은 꺼지지 않는다"]};
const FOE=LORDS[QS.get("foe")]?QS.get("foe"):"green",LD=LORDS[FOE];
const cost=id=>30+U[id][3]*18, every=id=>6+U[id][3]*1.5;
/* 저장 공유 */
let S=null;try{S=JSON.parse(localStorage.getItem("beastlord_v1"))}catch(_){}
const owned=S&&S.h?Object.keys(S.h).filter(k=>U[k]):["fox","boar","turtle","wolf","hawk","bunny"];
const lvOf=id=>S&&S.h&&S.h[id]?S.h[id].lv||1:1;
let myCards=(S&&S.deck||[]).filter(k=>U[k]&&owned.includes(k));if(myCards.length<3)myCards=owned.slice();
myCards=[...new Set(myCards)].sort((a,b)=>U[a][3]-U[b][3]).slice(0,7);
if(AUTO)myCards=QS.get("mirror")==="1"?LD[2].slice():["fox","boar","turtle","wolf","hawk","bunny"];
/* ===== 전장 (길이 1000 × 폭 400) ===== */
const L=1000,W=400,PAD=55;
let G;
function plots(t){const xs=t===0?[120,185]:[880,815];return [120,200,280].flatMap(y=>xs.map(x=>({x,y,b:null})))}
function newGame(){G={t:0,spd:1,over:false,gold:[120,120],inc:[6,5*(LD[3]?.8+LD[3]*.08:.55)],cast:[mkCastle(0),mkCastle(1)],plots:[plots(0),plots(1)],units:[],fx:[],shots:[],aiT:0,
 ai:LD[2].concat(owned.includes("bunny")?[]:[]),kills:[0,0]};
 if(LD[3]>=2)G.ai=G.ai.concat(["wolf","fox"]);if(LD[3]>=4)G.ai=G.ai.concat(["owl","croc"]);
 G.gold[1]+=LD[3]*25;bar();loop.last=performance.now()}
function mkCastle(t){return{k:"castle",t,x:t?L-40:40,y:W/2,hp:3000,mhp:3000,r:34,cd:0}}
/* 건물 짓기 · 강화 */
function build(t,id){const P=G.plots[t].find(p=>!p.b);const c=cost(id);if(!P||G.gold[t]<c)return false;G.gold[t]-=c;
 P.b={k:"bld",t,id,x:P.x,y:P.y,hp:380,mhp:380,r:20,lv:1,cd:1.2,ulv:t?1+Math.floor(LD[3]/2):lvOf(id)};pop(P.x,P.y,"🔨",t?"#F09A7A":"#8BE08F");if(!t)beep(520,.08);return true}
function upCost(b){return Math.round(cost(b.id)*.9*b.lv)}
function upgrade(t,b){if(b.lv>=3||G.gold[t]<upCost(b))return false;G.gold[t]-=upCost(b);b.lv++;b.mhp+=120;b.hp=b.mhp;pop(b.x,b.y,"⬆ Lv"+b.lv,"#F3D27A");if(!t)beep(780,.12);return true}
/* 유닛 */
function spawn(b){const d=U[b.id],n=d[10],m=(1+(b.ulv-1)*.1)*(1+(b.lv-1)*.25);
 for(let i=0;i<n;i++)G.units.push({k:"unit",t:b.t,id:b.id,em:d[0],x:b.x+(b.t?-24:24),y:b.y+(i?14:0)+(R()-.5)*10,hp:d[4]*m,mhp:d[4]*m,atk:d[5]*m,rng:d[6],spd:d[7]*(1+(R()-.5)*.1),acd:d[8],cd:.3,sp:d[9],r:d[4]>400?15:11,dot:0,dotT:0,reb:d[9].includes("rebirth")?1:0,fl:0})}
const foes=e=>[...G.units.filter(u=>u.t!==e.t&&u.hp>0),...G.plots[1-e.t].filter(p=>p.b).map(p=>p.b),G.cast[1-e.t]];
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function dmg(tg,d,src){if(tg.hp<=0)return;if(src&&src.sp.includes("siege")&&tg.k!=="unit")d*=3;tg.hp-=d;tg.fl=.12;
 if(d>=1)G.fx.push({x:tg.x+(R()-.5)*10,y:tg.y-tg.r,txt:"-"+Math.round(d),c:tg.t?"#FFE08A":"#FF8A7A",life:.7,big:d>=40});
 if(src&&src.sp.includes("poison")&&tg.k==="unit"){tg.dot=6;tg.dotT=3}
 if(tg.k==="castle"){shake(tg.t?3:5)}
 if(tg.hp<=0)die(tg,src)}
function die(e,src){if(e.k==="unit"){if(e.reb){e.reb=0;e.hp=e.mhp*.5;pop(e.x,e.y,"🔥 부활","#FFB13D");return}
  const k=1-e.t;const bonus=Math.round(3+U[e.id][3]*1.5);G.gold[k]+=bonus;G.kills[k]++;if(k===0)G.fx.push({x:e.x,y:e.y-20,txt:"+"+bonus+"🪙",c:"#F3D27A",life:.9});
  for(let i=0;i<7;i++)G.fx.push({x:e.x,y:e.y,vx:(R()-.5)*90,vy:(R()-.5)*90,dot:1,c:e.t?"#E05A4A":"#3FBF6A",life:.5})}
 if(e.k==="bld"){const P=G.plots[e.t].find(p=>p.b===e);if(P)P.b=null;pop(e.x,e.y,"💥","#fff");shake(4);if(e.t===0)toast("내 건물이 무너졌어요!")}
 if(e.k==="castle")end(e.t===1)}
/* ===== 한 틱 ===== */
function step(dt){if(G.over)return;G.t+=dt;
 for(const t of[0,1])G.gold[t]+=G.inc[t]*dt;
 for(const t of[0,1])for(const p of G.plots[t])if(p.b){p.b.cd-=dt;if(p.b.cd<=0){p.b.cd=every(p.b.id)*Math.pow(.82,p.b.lv-1);spawn(p.b)}}
 for(const c of G.cast){c.cd-=dt;if(c.cd<=0){const tg=G.units.filter(u=>u.t!==c.t&&u.hp>0&&dist(u,c)<190).sort((a,b)=>dist(a,c)-dist(b,c))[0];if(tg){c.cd=.9;G.shots.push({x:c.x,y:c.y-20,tx:tg.x,ty:tg.y,c:c.t?"#F09A7A":"#BFE8FF",life:.25});dmg(tg,30,null)}}}
 const lions=G.units.filter(u=>u.sp==="aura"&&u.hp>0);
 for(const u of G.units){if(u.hp<=0)continue;u.fl=Math.max(0,u.fl-dt);
  if(u.dotT>0){u.dotT-=dt;u.hp-=u.dot*dt;if(u.hp<=0){die(u,null);continue}}
  u.cd-=dt;const dir=u.t?-1:1;
  if(u.sp==="heal"){const al=G.units.filter(a=>a.t===u.t&&a!==u&&a.hp>0&&a.hp<a.mhp&&dist(a,u)<u.rng).sort((a,b)=>a.hp/a.mhp-b.hp/b.mhp)[0];
   if(al){if(u.cd<=0){u.cd=u.acd;al.hp=Math.min(al.mhp,al.hp+14*(u.mhp/60));G.fx.push({x:al.x,y:al.y-16,txt:"+",c:"#7DFF9A",life:.6})}}
   else{const lead=G.units.filter(a=>a.t===u.t&&a!==u&&a.hp>0).sort((a,b)=>dir*(b.x-a.x))[0];const gx=lead?lead.x-dir*40:u.x+dir*20;u.x+=Math.sign(gx-u.x)*Math.min(Math.abs(gx-u.x),u.spd*dt)}continue}
  let F=foes(u);if(u.sp==="assassin"){const rr=F.filter(f=>f.k==="unit"&&f.rng>60&&dist(f,u)<220);if(rr.length)F=rr}
  let tg=null,bd=1e9;for(const f of F){const d=dist(f,u)-(f.k==="unit"?0:f.r*.6)-(f.k==="unit"?.0:0);if(d<bd&&(d<170||f.k!=="unit")){bd=d;tg=f}}
  if(tg&&tg.k!=="unit"&&bd>170){/* 멀리 있는 건물은 길 따라 전진 */tg=bd<260?tg:null}
  const reach=u.rng+(tg?tg.r:0);
  if(tg&&dist(tg,u)<=reach){if(u.cd<=0){let a=u.atk;if(u.sp==="pack"&&G.units.some(o=>o!==u&&o.id===u.id&&o.t===u.t&&dist(o,u)<60))a*=1.3;if(lions.some(l=>l.t===u.t&&dist(l,u)<120))a*=1.15;
    u.cd=u.acd;if(u.rng>60)G.shots.push({x:u.x,y:u.y,tx:tg.x,ty:tg.y,c:u.sp.includes("splash")?"#C08BFF":"#FFE9A8",life:.18});else u.lunge=.12;
    if(u.sp.includes("splash")){for(const f of F)if(f.k==="unit"&&dist(f,tg)<44&&f!==tg)dmg(f,a*.6,u);G.fx.push({x:tg.x,y:tg.y,ring:1,c:"#C08BFF",life:.3})}
    if(u.sp==="charge"&&!u.used){a*=2;u.used=1}
    dmg(tg,a,u)}}
  else{let gx=tg?tg.x:u.x+dir*50,gy=tg?tg.y:(u.y+(W/2-u.y)*.02);const d=Math.hypot(gx-u.x,gy-u.y)||1;
   let sp=u.spd*(u.sp==="charge"&&!u.used?1.4:1);u.x+=(gx-u.x)/d*sp*dt;u.y+=(gy-u.y)/d*sp*dt*.8}
  u.y=Math.max(40,Math.min(W-40,u.y));u.lunge=Math.max(0,(u.lunge||0)-dt)}
 // 겹침 풀기
 const us=G.units;for(let i=0;i<us.length;i++)for(let j=i+1;j<us.length;j++){const a=us[i],b=us[j];if(a.hp<=0||b.hp<=0)continue;const d=dist(a,b),m=a.r+b.r-4;if(d<m&&d>0){const p=(m-d)/2,nx=(a.x-b.x)/d,ny=(a.y-b.y)/d;a.x+=nx*p;a.y+=ny*p;b.x-=nx*p;b.y-=ny*p}}
 G.units=G.units.filter(u=>u.hp>0);
 for(const f of G.fx){f.life-=dt;if(f.vx){f.x+=f.vx*dt;f.y+=f.vy*dt}else if(!f.ring)f.y-=28*dt}G.fx=G.fx.filter(f=>f.life>0);
 for(const s of G.shots)s.life-=dt;G.shots=G.shots.filter(s=>s.life>0);
 ai(dt);if(AUTO)autoMe(dt)}
/* AI */
function ai(dt){G.aiT-=dt;if(G.aiT>0)return;G.aiT=1.2;const t=1,P=G.plots[1];const free=P.some(p=>!p.b);
 const want=G.ai[Math.floor(R()*G.ai.length)];
 if(free&&G.gold[t]>=cost(want)){build(t,want);return}
 if(!free||G.gold[t]>260){const bs=P.filter(p=>p.b&&p.b.lv<3).map(p=>p.b).sort((a,b)=>a.lv-b.lv);if(bs[0])upgrade(t,bs[0])}}
let autoT=0;function autoMe(dt){autoT-=dt;if(autoT>0)return;autoT=1.4;const P=G.plots[0];const free=P.some(p=>!p.b);const pool=myCards.filter(k=>k!=="bunny"||P.filter(p=>p.b).length>=3);const want=pool[Math.floor(R()*pool.length)];if(free){build(0,want);return}const bs=P.filter(p=>p.b&&p.b.lv<3).map(p=>p.b);if(bs.length)upgrade(0,bs[0])}
/* ===== 그리기 ===== */
const cv=$("#cv"),cx=cv.getContext("2d");let VW,VH,DPR,port,sc,ox,oy,shk=0;
function fit(){const r=$("#wrap").getBoundingClientRect();DPR=Math.min(2,devicePixelRatio||1);VW=r.width;VH=r.height;cv.width=VW*DPR;cv.height=VH*DPR;port=VH>VW*1.1;
 sc=port?Math.min(VW/W,VH/(L+2*PAD)):Math.min(VW/(L+2*PAD),VH/W);ox=port?(VW-W*sc)/2:(VW-(L+2*PAD)*sc)/2+PAD*sc;oy=port?(VH-(L+2*PAD)*sc)/2+PAD*sc:(VH-W*sc)/2}
addEventListener("resize",fit);
const P2=(x,y)=>port?[ox+y*sc,oy+(L-x)*sc]:[ox+x*sc,oy+y*sc];
function shake(n){shk=Math.max(shk,n)}
function draw(){cx.setTransform(DPR,0,0,DPR,0,0);cx.clearRect(0,0,VW,VH);
 if(shk>0){cx.translate((R()-.5)*shk,(R()-.5)*shk);shk*=.9;if(shk<.3)shk=0}
 // 땅
