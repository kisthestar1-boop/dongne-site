<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>새싹 원정대 · 육성 시험판</title>
<meta name="theme-color" content="#2f4a2c">
<style>
:root{--ink:#3a2f22;--cream:#fbf5e6;--leaf:#5e8f4a;--leaf2:#8fbf6a;--gold:#f2c14e;--pink:#f3a6b5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#1e2a1c;overflow:hidden;font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{display:block;background:#cfe3c0;border-radius:6px;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.pad{position:fixed;bottom:max(30px,calc(env(safe-area-inset-bottom) + 18px));display:none;gap:10px;z-index:5}
.touch .pad{display:grid}
#padL{grid-template-areas:". u ." "l . r" ". d .";grid-template-columns:repeat(3,auto);place-items:center;gap:2px 4px}
#padR{grid-template-areas:"s f" "j a";grid-template-columns:repeat(2,auto);place-items:center;gap:4px 8px}
#padL{left:max(14px,env(safe-area-inset-left))}
#padR{right:max(14px,env(safe-area-inset-right))}
.btn{width:56px;height:56px;border-radius:50%;border:2px solid rgba(255,255,255,.6);background:rgba(251,245,230,.32);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;color:#3a2f22;box-shadow:0 3px 10px rgba(0,0,0,.25)}
.btn.s{width:46px;height:46px;font-size:18px}
.btn.big{width:70px;height:70px;font-size:28px;background:rgba(255,226,140,.5)}
.btn.on{transform:scale(.92);background:rgba(255,255,255,.9)}
.col{display:flex;flex-direction:column;gap:10px;align-items:center}
.portrait #wrap{align-items:flex-start;padding-top:max(8vh,env(safe-area-inset-top))}
.portrait canvas{border-radius:0}
.portrait .pad{bottom:max(12vh,calc(env(safe-area-inset-bottom) + 40px))}
.portrait .btn{width:66px;height:66px;font-size:30px;background:rgba(251,245,230,.18);border-color:rgba(255,255,255,.45);color:#fbf5e6}
.portrait .btn.s{width:54px;height:54px;font-size:20px}
.portrait .btn.big{width:86px;height:86px;font-size:36px;background:rgba(255,226,140,.35)}
.portrait #padL{left:16px}.portrait #padR{right:16px}
#hint{position:fixed;left:0;right:0;text-align:center;color:rgba(251,245,230,.55);font-size:13px;display:none}
.portrait #hint{display:block;bottom:max(3vh,env(safe-area-inset-bottom))}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="960" height="540"></canvas></div>
<div class="pad" id="padL">
  <div class="btn s" data-k="up" style="grid-area:u">▲</div>
  <div class="btn" data-k="left" style="grid-area:l">◀</div>
  <div class="btn" data-k="right" style="grid-area:r">▶</div>
  <div class="btn s" data-k="down" style="grid-area:d">▼</div>
</div>
<div class="pad" id="padR">
  <div class="btn s" data-k="skill" style="grid-area:s;background:rgba(160,210,140,.55)">🍃</div>
  <div class="btn s" data-k="friend" style="grid-area:f;background:rgba(243,166,181,.55)">🌸</div>
  <div class="btn" data-k="jump" style="grid-area:j">⤒</div>
  <div class="btn big" data-k="atk" style="grid-area:a">⚔</div>
</div>
<div id="hint">가로로 돌리면 더 크게 볼 수 있어요</div>
<script>
"use strict";
/* ============ 새싹 원정대 · 육성 시험판 v0.1 ============
   설계서: 메이플 화면 + 그랜드체이스 콤보 + 친구 파티(자동) + 계속 쌓이는 성장 */
const W=960,H=540;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let SCALE=1;
function fit(){const port=innerHeight>innerWidth*1.1;document.body.classList.toggle('portrait',port);
 const s=port?innerWidth/W:Math.min(innerWidth/W,innerHeight/H);const cw=W*s,ch=H*s;cv.style.width=cw+'px';cv.style.height=ch+'px';
 const dpr=Math.min(3,window.devicePixelRatio||1);let bw=Math.round(cw*dpr);if(bw>2880)bw=2880;if(bw<W)bw=W;
 cv.width=bw;cv.height=Math.round(bw*H/W);SCALE=cv.width/W;ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';}
addEventListener('resize',fit);fit();
const isTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0;
if(isTouch)document.body.classList.add('touch');

/* ---------- 이미지 ---------- */
const IMG={};const NAMES=['sprout','hedgehog','fox','bunny','owl','frog','sheep','baker','sprite_e0','sprite_e1','sprite_e2','sprite_e3','boss','bg_forest','p_idle','p_run','p_swing','p_jump','p_cast','fx_leaf','fox_idle','fox_shoot','bunny_idle','bunny_heal','hedgehog_idle','hedgehog_atk','sheep_idle','sheep_atk','ground','plat','bg_village','bg_marsh','m_e0','m_e1','m_e2','m_e3','boss2','it_bread','it_clover','it_mush','it_star','it_twig','it_seed','it_chest','it_jar','owl_idle','owl_cast','frog_idle','frog_play','baker','rival','thief'];
let loaded=0;
NAMES.forEach(n=>{const i=new Image();i.onload=()=>{loaded++};i.onerror=()=>{loaded++};i.src='img/'+n+(n.startsWith('bg_')?'.jpg':'.webp');IMG[n]=i;});

/* ---------- 저장 (계속 쌓이는 것) ---------- */
const SAVE_KEY='sprout_v1';
const DEF={inv:{},qk:{},qdone:{},qon:[],cleared:{},lastSeen:0,bakery:0,lv:1,exp:0,gold:0,friends:['fox','sheep','bunny'],party:['fox','sheep','bunny'],fstar:{fox:1,sheep:1,bunny:1},stars:{},best:{},kills:0,bestCombo:0,plays:0,job:0};
let SV;try{SV=Object.assign({},DEF,JSON.parse(localStorage.getItem(SAVE_KEY)||'{}'));}catch(e){SV=Object.assign({},DEF)}
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(SV))}catch(e){}}
const expNeed=lv=>Math.round(40*Math.pow(lv,1.45));

/* ---------- 친구 정의 ---------- */
const FR={
 fox:{n:'여우 궁수',role:'원거리',img:'fox',col:'#e98a3c'},
 sheep:{n:'양 방패병',role:'탱커',img:'sheep',col:'#efe3c4'},
 bunny:{n:'분홍 토끼',role:'회복',img:'bunny',col:'#f3a6b5'},
 hedgehog:{n:'고슴도치 검사',role:'돌격',img:'hedgehog',col:'#8a6a4a'},
 owl:{n:'부엉이 마법사',role:'범위 마법',img:'owl',col:'#a99be0'},
 frog:{n:'개구리 고수',role:'응원',img:'frog',col:'#7fb36a'}
};
const ORDER=['fox','sheep','bunny','hedgehog','owl','frog'];

/* ---------- 입력 ---------- */
const K={left:0,right:0,up:0,down:0,jump:0,atk:0,skill:0,friend:0};const P={};
const KEYMAP={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',KeyA:'left',KeyD:'right',KeyW:'up',KeyS:'down',KeyC:'jump',Space:'jump',KeyX:'atk',KeyJ:'atk',KeyZ:'skill',KeyK:'skill',KeyV:'friend',Digit1:'d1',Digit2:'d2',Digit3:'d3',Digit4:'d4',Digit5:'d5',KeyL:'friend',Enter:'atk'};
addEventListener('keydown',e=>{const k=KEYMAP[e.code];if(k){if(!K[k])P[k]=1;K[k]=1;e.preventDefault();audioInit();}});
addEventListener('keyup',e=>{const k=KEYMAP[e.code];if(k){K[k]=0;}});
document.querySelectorAll('.btn').forEach(b=>{const k=b.dataset.k;
 const on=e=>{e.preventDefault();if(!K[k])P[k]=1;K[k]=1;b.classList.add('on');audioInit();};
 const off=e=>{e.preventDefault();K[k]=0;b.classList.remove('on');};
 b.addEventListener('touchstart',on,{passive:false});b.addEventListener('touchend',off,{passive:false});b.addEventListener('touchcancel',off,{passive:false});
 b.addEventListener('mousedown',on);b.addEventListener('mouseup',off);b.addEventListener('mouseleave',off);});
let tapXY=null;
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect();tapXY={x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};audioInit();});
function pressed(k){if(P[k]){P[k]=0;return true}return false}

/* ---------- 소리 (작고 부드럽게) ---------- */
let AC=null;function audioInit(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}}
function beep(f,d,type,vol,slide){if(!AC)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f*slide),t+d);g.gain.setValueAtTime(vol||.08,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02);}
function noise(d,vol){if(!AC)return;const t=AC.currentTime,len=Math.floor(AC.sampleRate*d),b=AC.createBuffer(1,len,AC.sampleRate),ch=b.getChannelData(0);for(let i=0;i<len;i++)ch[i]=(Math.random()*2-1)*(1-i/len);const s=AC.createBufferSource(),g=AC.createGain(),f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=1800;s.buffer=b;g.gain.value=vol||.12;s.connect(f);f.connect(g);g.connect(AC.destination);s.start(t);}
const SFX={hit:(n)=>{noise(.07,.14);beep(220+n*30+Math.random()*40,.08,'triangle',.07,.5)},big:()=>{noise(.18,.22);beep(110,.25,'sine',.14,.4)},jump:()=>beep(420,.12,'sine',.05,1.6),swing:()=>beep(700+Math.random()*80,.05,'triangle',.025,.6),lv:()=>{[523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.18,'triangle',.07),i*90))},heal:()=>beep(880,.2,'sine',.05,1.3),skill:()=>{beep(330,.3,'sawtooth',.04,2.2);noise(.25,.08)},get:()=>{[784,988,1318].forEach((f,i)=>setTimeout(()=>beep(f,.15,'sine',.06),i*80))},hurt:()=>beep(180,.15,'square',.05,.6),coin:()=>beep(1200,.06,'sine',.04,1.4)};

/* ---------- 스테이지 (메이플식 여러 층 + 넝쿨) ---------- */
const GROUND=470;
const REGIONS={
 forest:{n:'버섯 숲',ic:'🍄',bg:'bg_forest',e:['e0','e1','e2','e3'],boss:'boss',bossN:'시든 고목 골렘',lv:1},
 marsh:{n:'반딧불 늪',ic:'🌙',bg:'bg_marsh',e:['m0','m1','m2','m3'],boss:'boss2',bossN:'가시왕관 늪거북',lv:6}
};
function makeStage(region){
 if(region==='village'){const len=2400;return {len,plats:[{x:-200,y:GROUND,w:len+400,ground:1},{x:900,y:340,w:220},{x:1180,y:250,w:180}],vines:[{x:1010,y1:346,y2:GROUND-4}],zones:[],village:1};}
 const R=REGIONS[region],E=R.e;const len=4200;
 const plats=[{x:-200,y:GROUND,w:len+400,ground:1}];
 const vines=[];
 const set=region==='marsh'?[[260,360,200],[560,280,220],[880,370,180],[1180,300,200],[1500,250,240],[1780,360,200],[2100,290,220],[2440,370,180],[2720,280,240],[3060,350,220],[3380,270,200]]
  :[[300,370,220],[620,290,180],[900,360,200],[1250,300,240],[1600,380,160],[1820,290,220],[2200,350,240],[2520,270,200],[2850,360,220],[3200,300,240],[3520,380,180]];
 set.forEach(([x,y,w],i)=>{plats.push({x,y,w});if(i%2===0)vines.push({x:x+w*0.5,y1:y+6,y2:GROUND-4});});
 const zones=[{x:200,until:1150,waves:[[E[0],3],[E[0],2,E[1],1]]},{x:1150,until:2400,waves:[[E[1],2,E[2],1],[E[0],2,E[3],2]]},{x:2400,until:3600,waves:[[E[2],2,E[3],2],[E[1],3,E[0],2]]},{x:3600,until:len,boss:1}];
 return {len,plats,vines,zones,region};
}

/* ---------- 상태 ---------- */
let ST,scene='title',titleT=0;
let REGION='forest';
function newRun(region){
 REGION=region||REGION;const S=makeStage(REGION);
 ST={S,t:0,camX:0,shake:0,hitstop:0,ents:[],fx:[],nums:[],shots:[],zone:0,waveIdx:0,waveOn:false,lock:null,
  combo:0,comboT:0,maxCombo:0,score:0,dmgTaken:0,kills:0,start:performance.now(),done:false,result:null,banner:null,friendCD:0,msg:[],
  pl:mkPlayer()};
 ST.friends=SV.party.filter(k=>SV.friends.includes(k)).slice(0,3).map((k,i)=>mkFriend(k,i));
 ST.fadeIn=.5;ST.loot={};
 if(REGION==='village'){ST.pl.x=ST.fromRight?2150:480;ST.friends.forEach((f,i)=>{f.x=ST.pl.x-60-i*40});villageEnter();}
 else banner(REGIONS[REGION].n+' · 1구역','친구들과 함께 앞으로!');
}
function mkPlayer(){
 const lv=SV.lv;
 return {x:380,y:GROUND,vx:0,vy:0,face:1,w:34,h:70,onG:true,onVine:null,hp:100+lv*12,hpMax:100+lv*12,mp:0,mpMax:300,atk:10+lv*3,
  combo:0,atkT:0,atkCD:0,buf:0,inv:0,hurtT:0,coyote:0,jumpBuf:0,state:'idle',anim:0,drop:0,skillT:0};
}
function mkFriend(k,i){const st=SV.fstar[k]||1;return {k,x:330-i*40,y:GROUND,vx:0,vy:0,face:1,onG:true,cd:1+i*.4,anim:Math.random()*6,act:0,lv:st,hop:0,taunt:0}}
const ENEMY={
 e0:{n:'시든 새싹',img:'sprite_e0',hp:38,atk:8,spd:55,h:56,exp:6,col:'#a8834e'},
 e1:{n:'가시 덤불',img:'sprite_e1',hp:30,atk:10,spd:120,h:52,exp:7,col:'#7c8a3e',roll:1},
 e2:{n:'졸린 독버섯',img:'sprite_e2',hp:80,atk:12,spd:40,h:70,exp:12,col:'#9a86c6'},
 e3:{n:'그림자 도깨비불',img:'sprite_e3',hp:34,atk:9,spd:70,h:64,exp:10,col:'#6a6a8a',fly:1,shoot:1},
 boss:{n:'시든 고목 골렘',img:'boss',hp:1300,atk:16,spd:38,h:150,exp:150,col:'#6b4a3a',boss:1,drop:['it_star',1]},
 m0:{n:'투덜 진흙이',img:'m_e0',hp:70,atk:12,spd:50,h:56,exp:14,col:'#7a5a3a',drop:['it_twig',.3]},
 m1:{n:'따끔 잠자리',img:'m_e1',hp:44,atk:12,spd:110,h:56,exp:14,col:'#9fc8d8',fly:1,dive:1},
 m2:{n:'삐죽 부들이',img:'m_e2',hp:60,atk:14,spd:60,h:80,exp:16,col:'#a87c4a',shoot:1,drop:['it_seed',.25]},
 m3:{n:'등불 유령',img:'m_e3',hp:56,atk:13,spd:70,h:72,exp:18,col:'#9a7ac8',fly:1,shoot:1,drop:['it_jar',.45]},
 boss2:{n:'가시왕관 늪거북',img:'boss2',hp:2600,atk:22,spd:46,h:140,exp:320,col:'#5a7a4a',boss:1,charge:1,drop:['it_star',2]}
};
ENEMY.e0.drop=['it_twig',.35];ENEMY.e2.drop=['it_mush',.55];ENEMY.e3.drop=['it_clover',.12];
const ITEMS={it_bread:'빵',it_clover:'네잎클로버',it_mush:'버섯 갓',it_star:'별 조각',it_twig:'마른 가지',it_seed:'꽃씨 주머니',it_chest:'보물 상자',it_jar:'반딧불 병'};
function spawn(type,x,y){const d=ENEMY[type];const sc=(1+(SV.lv-1)*.12)*(REGION==='marsh'?Math.max(1,1.6-SV.lv*.04):1);
 const e={type,d,x,y:y||GROUND,vx:0,vy:0,face:-1,hp:Math.round(d.hp*sc),hpMax:Math.round(d.hp*sc),atk:Math.round(d.atk*(1+(SV.lv-1)*.08)),hit:0,stun:0,wind:0,cd:1+Math.random(),onG:!d.fly,anim:Math.random()*6,fly:d.fly,air:0,dead:0,spawnT:.5,phase:0};
 if(d.fly)e.y=GROUND-60-Math.random()*50;ST.ents.push(e);return e;}

/* ---------- 연출 ---------- */
function banner(t,s){ST.banner={t,s,life:2.6}}
function popNum(x,y,v,kind){ST.nums.push({x,y,v,kind:kind||'n',life:.9,vy:-120,s:kind==='crit'?1.25:1})}
function particles(x,y,col,n,spd,kind){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=spd*(.4+Math.random()*.8);ST.fx.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-60,life:.5+Math.random()*.4,col,r:2+Math.random()*4,kind:kind||'dot',rot:Math.random()*6})}}
function shake(a){ST.shake=Math.max(ST.shake,a*(SV.calm?0.4:1))}
function hitstop(t){ST.hitstop=Math.max(ST.hitstop,t)}

/* ---------- 물리 ---------- */
const GRAV=1900;
function landOn(o,prevY){ // 한쪽 발판 (아래에서 통과)
 for(const p of ST.S.plats){
  if(o.x<p.x-4||o.x>p.x+p.w+4)continue;
  if(p.ground){if(o.y>=p.y){o.y=p.y;o.vy=0;return true}continue}
  if(o.drop>0)continue;
  if(o.vy>=0&&prevY<=p.y+2&&o.y>=p.y){o.y=p.y;o.vy=0;return true}
 }return false;
}
function onPlat(o){for(const p of ST.S.plats){if(o.x>=p.x-4&&o.x<=p.x+p.w+4&&Math.abs(o.y-p.y)<2)return p}return null}

/* ---------- 플레이어 ---------- */
function attackBox(p,range,h){return {x1:p.face>0?p.x:p.x-range,x2:p.face>0?p.x+range:p.x,y1:p.y-h,y2:p.y+10}}
function dealHits(box,dmgBase,opt){
 let n=0;
 for(const e of ST.ents){if(e.dead||e.spawnT>0)continue;const eh=e.d.h;
  if(e.x+20<box.x1||e.x-20>box.x2||e.y<box.y1||e.y-eh>box.y2)continue;
  const crit=Math.random()<(opt.crit||.12);let dmg=Math.round(dmgBase*(0.9+Math.random()*.25)*(crit?1.7:1));
  e.hp-=dmg;e.hit=.12;n++;
  const kb=(opt.kb||120)*(e.d.boss?.25:1);e.vx=(opt.dir||ST.pl.face)*kb;if(opt.lift&&!e.d.boss){e.vy=-opt.lift;e.onG=false;e.air=1}
  e.stun=Math.max(e.stun,e.d.boss?.05:(opt.stun||.32));e.wind=0;
  popNum(e.x+(Math.random()*16-8),e.y-eh-6,dmg,crit?'crit':(opt.fromFriend?'f':'n'));
  particles(e.x,e.y-eh*.5,opt.col||'#fff6c8',crit?10:6,crit?260:180,opt.leaf?'leaf':'dot');
  if(!opt.fromFriend){ST.combo++;ST.comboT=2.2;ST.maxCombo=Math.max(ST.maxCombo,ST.combo);ST.pl.mp=Math.min(ST.pl.mpMax,ST.pl.mp+(opt.mpGain||9));}
  ST.score+=dmg;
  if(e.hp<=0)kill(e);
 }
 if(n){SFX.hit(Math.min(ST.combo,10));if(!opt.fromFriend){hitstop(opt.stop||.05);shake(opt.sh||3)}else hitstop(.02);}
 return n;
}
function kill(e){if(e.dead)return;e.dead=1;e.deadT=.6;ST.kills++;SV.kills++;
 particles(e.x,e.y-e.d.h*.5,e.d.col,18,300,'leaf');
 const exp=Math.round(e.d.exp*(1+(SV.lv-1)*.15));gainExp(exp,e.x,e.y-e.d.h);
 SV.qk[e.type]=(SV.qk[e.type]||0)+1;
 if(e.d.drop&&Math.random()<e.d.drop[1]){const n=e.d.drop[1]>1?e.d.drop[1]:1;for(let k=0;k<n;k++)ST.fx.push({x:e.x,y:e.y-30,vx:(Math.random()-.5)*120,vy:-320,life:6,kind:'item',it:e.d.drop[0],r:14})}
 const g=e.d.boss?(REGION==='marsh'?90:40):1+Math.floor(Math.random()*3)+(REGION==='marsh'?2:0);ST.fx.push({x:e.x,y:e.y-20,vx:(Math.random()-.5)*80,vy:-260,life:3,kind:'coin',g,r:7});
 if(e.d.boss){shake(10);hitstop(.25);SFX.big();setTimeout(()=>finishRun(true),1400)}
}
function gainExp(v,x,y){SV.exp+=v;popNum(x,y-14,'+'+v+' EXP','exp');

function qProg(id){const q=QUESTS[id];
 if(q.kill){const b=(SV.qbase&&SV.qbase[id])||0;return [Math.min(q.kill[1],(SV.qk[q.kill[0]]||0)-b),q.kill[1]]}
 if(q.need){const k=Object.keys(q.need)[0];return [Math.min(q.need[k],SV.inv[k]||0),q.need[k]]}
 return q.cond()}
function qReady(id){const [a,b]=qProg(id);return a>=b}
function npcQuest(npc){return Object.keys(QUESTS).find(id=>QUESTS[id].npc===npc&&!SV.qdone[id]&&(!QUESTS[id].lock||QUESTS[id].lock()))}
function npcMark(npc){const id=npcQuest(npc);if(!id)return '';if(SV.qon.includes(id))return qReady(id)?'?':'…';return '!'}
function give(rw){const p=ST.pl;const out=[];
 if(rw.gold){SV.gold+=rw.gold;out.push('🪙 '+rw.gold)}
 if(rw.exp){gainExp(rw.exp,p.x,p.y-60);out.push('EXP '+rw.exp)}
 if(rw.bread){SV.inv.it_bread=(SV.inv.it_bread||0)+rw.bread;out.push('🍞 빵 '+rw.bread)}
 if(rw.item){SV.inv[rw.item]=(SV.inv[rw.item]||0)+1;out.push(ITEMS[rw.item])}
 if(rw.friend&&!SV.friends.includes(rw.friend)){SV.friends.push(rw.friend);SV.fstar[rw.friend]=1;if(SV.party.length<3)SV.party.push(rw.friend);out.push('새 친구 '+FR[rw.friend].n);ST.newCard=rw.friend;ST.newCardT=3.2;}
 if(rw.job&&!SV.job){SV.job=1;out.push('전직: 꽃의 기사');}
 SFX.get();save();return out.join(' · ')}
function talk(npc){
 const N=NPC[npc];const id=npcQuest(npc);const D={who:npc,name:N.n,opts:[]};
 if(npc==='thief'){D.text='반짝이는 걸 모으고 있어. 바꿔 줄래?';
  D.opts.push({t:'마른 가지 5 → 🪙50',ok:(SV.inv.it_twig||0)>=5,cb:()=>{SV.inv.it_twig-=5;SV.gold+=50;SFX.coin();save();D.text='고마워! 다음에 또 와.'}});
  D.opts.push({t:'별 조각 2 → 친구 ★+1',ok:(SV.inv.it_star||0)>=2&&SV.party.some(k=>(SV.fstar[k]||1)<5),cb:()=>{SV.inv.it_star-=2;const k=SV.party.filter(k=>(SV.fstar[k]||1)<5).sort((a,b)=>(SV.fstar[a]||1)-(SV.fstar[b]||1))[0];SV.fstar[k]=(SV.fstar[k]||1)+1;SFX.lv();save();D.text=FR[k].n+' 별이 하나 늘었어! ★'+SV.fstar[k]}});
  D.opts.push({t:'보물 상자 열기',ok:(SV.inv.it_chest||0)>=1,cb:()=>{SV.inv.it_chest-=1;const g=80+Math.floor(Math.random()*120);SV.gold+=g;SV.inv.it_star=(SV.inv.it_star||0)+1;SFX.get();save();D.text='상자 속에 🪙'+g+' 와 별 조각 1개!'}});
 }
else if(!id){D.text=npc==='baker'?'오늘도 빵 냄새 좋지? 친구들이 쉬는 동안 같이 구워 줘.':'다음엔 진짜 대결이야. 대전 모드에서 만나!';}
 else{const q=QUESTS[id];
  if(!SV.qon.includes(id)){D.text='부탁이 있어요: '+q.n+'\n'+q.d;D.opts.push({t:'좋아요!',ok:1,cb:()=>{SV.qon.push(id);if(q.kill){SV.qbase=SV.qbase||{};SV.qbase[id]=SV.qk[q.kill[0]]||0}save();SFX.get();D.text='고마워요! 진행은 오른쪽 위에 보여요.';D.opts=[]}});}
  else if(qReady(id)){D.text=q.n+' 완료! 정말 고마워요.';D.opts.push({t:'보상 받기',ok:1,cb:()=>{if(q.need)for(const k in q.need)SV.inv[k]-=q.need[k];SV.qon=SV.qon.filter(x=>x!==id);SV.qdone[id]=1;D.text='보상: '+give(q.rw);D.opts=[]}});}
  else{const [a,b]=qProg(id);D.text=q.n+' ('+a+'/'+b+')\n'+q.d;}
 }
 if(npc==='rival')D.opts.push({t:'⚔ 카드 대전',ok:1,cb:()=>startDuel()});
 ST.dlg=D;}

  const bread=Math.floor(hrs*helpers*.6),gold=Math.floor(hrs*helpers*14);
  if(gold>=5){SV.gold+=gold;SV.inv.it_bread=(SV.inv.it_bread||0)+bread;ST.dlg={who:'baker',name:'빵집 미루',text:'다녀오는 동안 친구들이랑 빵을 구웠어요!\n🍞 빵 '+bread+'개 · 🪙 '+gold+' (쉬는 친구가 많을수록 더 많이)',opts:[]};}}
 SV.lastSeen=now;save();}

let DU=null;

function startDuel(){SV.duel=SV.duel||{win:0,lose:0};SV.land=SV.land||0;
 const lg=Math.min(8,SV.duel.win);const cm=600*(1+lg*.12);
 DU={t:0,lg,en:5,ee:4,units:[],fx:[],deck:duelDeck(),me:{hp:600,max:600},foe:{hp:cm,max:cm},done:null,T:0,aiT:2,
  pool:lg>=2?['e0','e1','e2','e3','m0','m1','m2','m3']:['e0','e1','e2','e3']};
 ST.dlg=null;scene='duel';SFX.get();}
function duelSpawn(side,k){const d=side>0?UCARD[k]:ECARD[k];
 const m=side>0?(1+((SV.fstar[k]||1)-1)*.15)*(1+(SV.lv-1)*.03):(1.15+DU.lg*.1);
 DU.units.push({side,k,d,x:side>0?120:840,y:DG-2+Math.random()*16,hp:d.hp*m,hpMax:d.hp*m,dmg:d.dmg*m,cd:.5,act:0,anim:Math.random()*5,hit:0});
 for(let i=0;i<8;i++)DU.fx.push({x:side>0?120:840,y:DG-30,vx:(Math.random()-.5)*160,vy:-Math.random()*200,life:.5,col:side>0?'#cdeaa0':'#c9b6ff',r:4});}

 D.en=Math.min(10,D.en+dt/1.1);D.ee=Math.min(10,D.ee+dt/(1.0-Math.min(.3,D.lg*.04)));
 D.aiT-=dt;if(D.aiT<=0){const k=D.pool[Math.floor(Math.random()*D.pool.length)];if(D.ee>=ECARD[k].cost){D.ee-=ECARD[k].cost;duelSpawn(-1,k);D.aiT=.8+Math.random()*1.2}else D.aiT=.4}
 for(const u of D.units){u.anim+=dt;if(u.act>0)u.act-=dt;if(u.hit>0)u.hit-=dt;u.cd-=dt;
  let tgt=null,bd=1e9;for(const o of D.units){if(o.side===u.side||o.hp<=0)continue;const dd=(o.x-u.x)*u.side;if(dd>-20&&dd<bd){bd=dd;tgt=o}}

   if(hurt&&u.cd<=0){hurt.hp=Math.min(hurt.hpMax,hurt.hp+u.d.heal*(u.dmg/u.d.dmg));u.cd=u.d.rate;u.act=.3;DU.fx.push({x:hurt.x,y:hurt.y-60,vx:0,vy:-50,life:.7,txt:'♥',col:'#ff8fb0'});continue}}
  const buff=D.units.some(o=>o.side===u.side&&o.d.buff&&o.hp>0&&Math.abs(o.x-u.x)<160)?1.3:1;
  if(tgt&&bd<=u.d.range){if(u.cd<=0){u.cd=u.d.rate;u.act=.3;const dm=u.dmg*buff;
    if(u.d.splash){for(const o of D.units)if(o.side!==u.side&&Math.abs(o.x-tgt.x)<u.d.splash){o.hp-=dm;o.hit=.15}DU.fx.push({x:tgt.x,y:tgt.y-40,vx:0,vy:0,life:.4,ring:1,col:'#d8cfff',r:10})}
    else{tgt.hp-=dm;tgt.hit=.15}
    if(u.d.shot)DU.fx.push({x:u.x,y:u.y-40,tx:tgt.x,ty:tgt.y-40,life:.18,beam:1,col:u.side>0?'#ffe0a0':'#b89cff'});
    DU.fx.push({x:tgt.x,y:tgt.y-70,vx:0,vy:-70,life:.6,txt:Math.round(dm),col:'#fff3c4'});}}
  else if(cd<=u.d.range+10){if(u.cd<=0){u.cd=u.d.rate;u.act=.3;const c=u.side>0?D.foe:D.me;c.hp-=u.dmg*buff;c.hit=.15;shakeD=4;if(u.d.shot)DU.fx.push({x:u.x,y:u.y-40,tx:castleX,ty:DG-90,life:.18,beam:1,col:'#ffe0a0'});}}

 for(const u of D.units)if(u.hp<=0&&!u.dead){u.dead=.5;if(u.side<0)D.en=Math.min(10,D.en+.3)}

function rankOf(){const t=(performance.now()-ST.start)/1000;let s=0;s+=Math.min(40,ST.maxCombo*1.2);s+=ST.dmgTaken<60?30:ST.dmgTaken<160?18:6;s+=t<150?30:t<240?20:10;return s>=85?'S':s>=65?'A':s>=45?'B':'C'}
function finishRun(win){
 if(ST.done)return;ST.done=true;SV.plays++;SV.bestCombo=Math.max(SV.bestCombo,ST.maxCombo);
 const t=Math.round((performance.now()-ST.start)/1000);let rank=win?rankOf():'-';let newFriend=null,stars=0;
 if(win){
  stars=rank==='S'?3:rank==='A'?2:1;SV.stars[REGION]=Math.max(SV.stars[REGION]||0,stars);
  const first=!SV.cleared[REGION];SV.cleared[REGION]=(SV.cleared[REGION]||0)+1;ST.first=first;
  if(REGION==='forest'&&!SV.friends.includes('hedgehog')){newFriend='hedgehog';SV.friends.push('hedgehog');SV.fstar.hedgehog=1;}
  else{const k=ST.friends[Math.floor(Math.random()*ST.friends.length)];if(k){SV.fstar[k.k]=Math.min(5,(SV.fstar[k.k]||1)+1);ST.starUp=k.k}}
  ST.goldWin=REGION==='marsh'?(first?320:120):60;SV.gold+=ST.goldWin;
 }
 ST.friends.forEach(f=>{SV.fstar[f.k]=SV.fstar[f.k]||1});
 save();
 ST.result={win,rank,t,stars,newFriend,combo:ST.maxCombo,kills:ST.kills,T:0};
 SV.lastSeen=SV.lastSeen||Date.now();save();setTimeout(()=>{scene='result'},win?600:900);
}

function drawBG(){
 const bg=IMG[(scene==='title'||scene==='book'||!ST)?'bg_village':(REGION==='village'?'bg_village':REGIONS[REGION].bg)]||IMG.bg_forest;const par=.25;
 if(bg.complete&&bg.naturalWidth){const bw=bg.naturalWidth*(H/bg.naturalHeight);let x=-((ST?ST.camX:titleT*40)*par)%bw;if(x>0)x-=bw;for(;x<W;x+=bw)ctx.drawImage(bg,x,0,bw,H);}
 else{ctx.fillStyle='#d9ead0';ctx.fillRect(0,0,W,H)}
 // 아래쪽 안개
 const g=ctx.createLinearGradient(0,H*.55,0,H);g.addColorStop(0,'rgba(251,245,230,0)');g.addColorStop(1,'rgba(251,245,230,.55)');ctx.fillStyle=g;ctx.fillRect(0,H*.55,W,H*.45);
}
function drawPlat(p,cx){
 const x=p.x-cx,y=p.y;
 if(p.ground){
  ctx.fillStyle='#c4a07c';ctx.fillRect(0,y+30,W,H-y);
  const g=IMG.ground;if(g.naturalWidth){const k=.62,tw=g.naturalWidth*k,th=g.naturalHeight*k;let sx=-((cx*1)%tw);if(sx>0)sx-=tw;for(;sx<W;sx+=tw-1)ctx.drawImage(g,sx,y-33*k,tw,th);}
  else{ctx.fillStyle='#86b866';ctx.fillRect(0,y-4,W,24)}
  return}
 if(x>W+40||x+p.w<-40)return;
 const im=IMG.plat;
 if(im.naturalWidth){const dw=p.w+36,dh=74;ctx.save();ctx.shadowColor='rgba(40,30,20,.18)';ctx.shadowBlur=12;ctx.shadowOffsetY=8;ctx.drawImage(im,x-18,y-dh*30/174,dw,dh);ctx.restore();return}
 ctx.fillStyle='#9a7a52';roundRect(x,y+6,p.w,26,13);ctx.fill();
 const g=ctx.createLinearGradient(0,y-6,0,y+12);g.addColorStop(0,'#9ccb76');g.addColorStop(1,'#6e9e52');ctx.fillStyle=g;roundRect(x-4,y-6,p.w+8,16,8);ctx.fill();
}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function drawVine(v,cx){const x=v.x-cx;if(x<-20||x>W+20)return;ctx.strokeStyle='#5c8a3c';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(x,v.y1);for(let y=v.y1;y<v.y2;y+=10)ctx.lineTo(x+Math.sin(y*.08)*3,y);ctx.stroke();ctx.fillStyle='#86bf5c';for(let y=v.y1+12;y<v.y2;y+=26){ctx.beginPath();ctx.ellipse(x+(y%52?7:-7),y,7,4,(y%52?.6:-.6),0,7);ctx.fill()}}
function sprite(img,x,y,h,face,opt){
 opt=opt||{};if(!img||!img.naturalWidth){ctx.fillStyle=opt.col||'#888';ctx.beginPath();ctx.ellipse(x,y-h/2,h*.3,h/2,0,0,7);ctx.fill();return}
 if(opt.k){h=img.naturalHeight*opt.k}const w=img.naturalWidth*(h/img.naturalHeight);
 ctx.save();ctx.translate(x,y);
 // 그림자
 if(!opt.noShadow){ctx.fillStyle='rgba(40,30,20,.18)';ctx.beginPath();ctx.ellipse(0,(opt.sy||0),w*.32,5,0,0,7);ctx.fill();}
 ctx.translate(0,opt.dy||0);if(opt.rot)ctx.rotate(opt.rot);
 ctx.scale((face<0?-1:1)*(opt.sx||1),opt.sy2||1);
 if(opt.alpha!=null)ctx.globalAlpha=opt.alpha;
 ctx.drawImage(img,-w/2,-h,w,h);
 if(opt.flash>0){ctx.globalCompositeOperation='lighter';ctx.globalAlpha=Math.min(.85,opt.flash);ctx.drawImage(img,-w/2,-h,w,h);ctx.drawImage(img,-w/2,-h,w,h);}
 ctx.restore();
}
function drawPlayer(cx){
 const p=ST.pl,x=p.x-cx;const t=p.anim;
 let dy=0,sx=1,sy=1,rot=0,img=IMG.p_idle;
 if(p.state==='run'){img=(Math.floor(t*9)%2)?IMG.p_run:IMG.p_idle;dy=-Math.abs(Math.sin(t*9*Math.PI/2))*4}
 else if(p.state==='idle'){sy=1+Math.sin(t*3)*.012}
 else if(p.state==='jump'){img=IMG.p_jump;sy=p.vy<0?1.04:.98}
 else if(p.state==='climb'){img=IMG.p_jump;rot=Math.sin(p.y*.05)*.05}
 if(p.state==='a3'||p.state==='air'||p.state==='up'){img=IMG.p_swing}
 else if(p.state==='a1'||p.state==='a2'){img=p.atkT>.1?IMG.p_swing:IMG.p_idle;rot=p.face*(p.atkT>.1?-.05:.05)}
 if(p.skillT>0)img=IMG.p_cast;
 const blink=p.inv>0&&Math.floor(p.inv*20)%2===0;
 if(p.atkT>0&&p.state!=='climb'){drawSlash(p,x)}
 sprite(img&&img.naturalWidth?img:IMG.sprout,x,p.y,96,p.face,{k:img&&img.naturalWidth?.5:0,dy,sx,sy2:sy,rot,alpha:blink?.35:1,flash:p.hurtT>0?.6:0});
 if(p.skillT>0&&IMG.fx_leaf.naturalWidth){ctx.save();ctx.globalAlpha=Math.min(1,p.skillT*3);sprite(IMG.fx_leaf,x+p.face*60,p.y-20,0,p.face,{k:.6+(0.5-p.skillT),noShadow:1,rot:ST.t*4});ctx.restore()}
 nameTag(x,p.y+18,SV.job?'꽃의 기사':'새싹 소녀',SV.job?'#ffd86b':'#fbf5e6');
}
function drawSlash(p,x){
 const prog=1-p.atkT/(p.state==='a3'?.34:.22);const r=p.state==='a3'?92:70;
 ctx.save();ctx.translate(x+p.face*10,p.y-46);ctx.scale(p.face,1);
 const a0=p.state==='up'?1.6:-1.1,a1=p.state==='up'?-1.4:1.2;const a=a0+(a1-a0)*Math.min(1,prog*1.4);
 ctx.globalAlpha=Math.max(0,(p.state==='a3'?.6:.9)-prog);ctx.strokeStyle=p.state==='a3'?'#ffe27a':'#f6ffe0';ctx.lineWidth=p.state==='a3'?14:9;ctx.lineCap='round';
 ctx.beginPath();ctx.arc(0,0,r,Math.min(a0,a),Math.max(a0,a));ctx.stroke();
 ctx.globalAlpha=Math.max(0,.6-prog);ctx.strokeStyle='#a8e07a';ctx.lineWidth=4;ctx.beginPath();ctx.arc(0,0,r-14,Math.min(a0,a),Math.max(a0,a));ctx.stroke();
 ctx.restore();
}
function nameTag(x,y,t,col){ctx.font='bold 12px system-ui';const w=ctx.measureText(t).width+12;ctx.fillStyle='rgba(40,30,20,.55)';roundRect(x-w/2,y,w,17,6);ctx.fill();ctx.fillStyle=col||'#fff';ctx.textAlign='center';ctx.fillText(t,x,y+13);ctx.textAlign='left'}

 });

function drawEnemies(cx){
 for(const e of ST.ents){const x=e.x-cx;if(x<-200||x>W+200)continue;const h=e.d.h*(e.d.boss?1.45:1.2);
  let alpha=1,dy=0,sy=1,rot=0;
  if(e.spawnT>0){alpha=1-e.spawnT/.6;dy=e.spawnT*30}
  if(e.dead){alpha=Math.max(0,e.deadT/.6);sy=1-(.6-e.deadT)*.8;}
  if(e.wind>0){sy=.9;rot=-e.face*.08;}
  if(e.stun>0&&!e.dead)rot=e.face*.15;
  if(!e.dead&&e.d.roll&&e.lunge>0)rot=e.anim*12*e.face;
  const bob=e.fly?0:Math.abs(Math.sin(e.anim*6))*2;
  sprite(IMG[e.d.img],x,e.y,h,-e.face,{dy:dy-bob,sy2:sy,rot,alpha,flash:e.hit>0?e.hit*8:0,noShadow:e.fly});
  if(e.wind>0&&!e.dead){ctx.fillStyle='#ff6b6b';ctx.font='bold 22px system-ui';ctx.textAlign='center';ctx.fillText('!',x,e.y-h-8);ctx.textAlign='left'}
  if(!e.dead&&!e.d.boss&&e.hp<e.hpMax){ctx.fillStyle='rgba(0,0,0,.35)';roundRect(x-22,e.y-h-10,44,6,3);ctx.fill();ctx.fillStyle='#ff8a8a';roundRect(x-22,e.y-h-10,44*e.hp/e.hpMax,6,3);ctx.fill()}
 }

 // 보스 체력
 const boss=ST.ents.find(e=>e.d.boss&&!e.dead);if(boss){ctx.fillStyle='rgba(40,32,24,.75)';roundRect(W/2-220,14,440,26,10);ctx.fill();ctx.fillStyle='#8a5aa8';roundRect(W/2-214,20,428*boss.hp/boss.hpMax,14,6);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 12px system-ui';ctx.textAlign='center';ctx.fillText(boss.d.n,W/2,32);ctx.textAlign='left'}
 // 화살표 안내

function drawTitle(dt){
 titleT+=dt;drawBG();
 // 친구들 행진
 const all=SV.friends;all.forEach((k,i)=>{const x=(W+200)-((titleT*70+i*90)%(W+300));sprite(IMG[FR[k].img],x,GROUND+10,70,-1,{dy:-Math.abs(Math.sin(titleT*8+i))*6})});

 if(loaded<NAMES.length){ctx.fillStyle='#fff';ctx.fillText('그림 불러오는 중… '+loaded+'/'+NAMES.length,20,30)}

  ctx.font='bold 26px system-ui';ctx.fillStyle='#f2a41a';ctx.fillText('★'.repeat(R.stars)+'☆'.repeat(3-R.stars),W/2,224);}

 if(R.win&&REGION==='forest'&&ST.first&&!R.newFriend){ctx.fillStyle='#5e8f4a';ctx.font='900 16px system-ui';ctx.fillText('🌙 반딧불 늪이 열렸어요!',W/2,320)}

 else if(!R.win){ctx.fillStyle='#3a2f22';ctx.font='bold 15px system-ui';ctx.fillText('얻은 경험치와 코인은 그대로 남아요. 레벨을 올려 다시 도전해요!',W/2,344);}

/* ---------- 메인 루프 ---------- */
let last=performance.now();
function loop(now){
 ctx.setTransform(SCALE,0,0,SCALE,0,0);
 let dt=Math.min(.05,(now-last)/1000);last=now;
 if(tapXY){for(const b of btns){if(tapXY.x>=b.x&&tapXY.x<=b.x+b.w&&tapXY.y>=b.y&&tapXY.y<=b.y+b.h){b.cb();break}}tapXY=null}
 if(scene==='title'){if(pressed('atk')||pressed('jump')){newRun('village');scene='play'}drawTitle(dt);}
 else if(scene==='book'){drawBook();}
 else if(scene==='duel'){updDuel(dt);drawDuel(dt);}
 else{
  let sim=dt;if(ST.hitstop>0){ST.hitstop-=dt;sim=dt*.06;}
  if(ST.buff>0){ST.buff-=dt;if(ST.pl.atkCD>0)ST.pl.atkCD-=dt*.5}
  if(scene==='play'&&!ST.done){ST.t+=sim;if(ST.S.village){updVillage(sim);if(ST.dlg){ST.pl.vx=0;for(const k in K)K[k]=0}}else autoBread(sim);if(!ST.dlg)updPlayer(sim);updFriends(sim);updEnemies(sim);updShots(sim);updZones(sim);
   if(ST.comboT>0){ST.comboT-=sim;if(ST.comboT<=0)ST.combo=0}
   if(ST.banner){ST.banner.life-=dt;if(ST.banner.life<=0)ST.banner=null}}
  else{ST.t+=dt;updEnemies(dt*.3)}
  // 카메라
  const tx=Math.max(0,Math.min(ST.S.len-W,ST.pl.x-W*(isTouch?.5:.42)+ST.pl.face*40));ST.camX+=(tx-ST.camX)*Math.min(1,dt*6);
  if(ST.lock)ST.camX=Math.max(ST.lock.a-40,Math.min(ST.lock.b-W+40,ST.camX));
  let sx=0,sy=0;if(ST.shake>0){sx=(Math.random()-.5)*ST.shake*2;sy=(Math.random()-.5)*ST.shake*2;ST.shake=Math.max(0,ST.shake-dt*30)}
  ctx.save();drawBG();ctx.translate(sx,sy);const cx=Math.round(ST.camX);
  ST.S.plats.forEach(p=>drawPlat(p,cx));ST.S.vines.forEach(v=>drawVine(v,cx));if(ST.S.village)drawVillageObjs(cx);
  drawEnemies(cx);drawFriends(cx);drawPlayer(cx);drawShots(cx);drawFX(cx,sim);drawNums(cx,sim);
  ctx.restore();drawHUD();
  if(scene==='result')drawResult(dt);
  if(ST.fadeIn>0){ctx.fillStyle='rgba(30,25,20,'+Math.min(1,ST.fadeIn*2)+')';ctx.fillRect(0,0,W,H);ST.fadeIn-=dt}
  if(ST.warp){ST.warp.t-=dt;ctx.fillStyle='rgba(30,25,20,'+Math.min(1,1-ST.warp.t/.6)+')';ctx.fillRect(0,0,W,H);if(ST.warp.t<=0){const to=ST.warp.to;newRun(to);}}
  if(scene==='play'&&!ST.done&&(pressed('atk')&&false)){}
 }
 requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
