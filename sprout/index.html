let W=960,VW=960,ZOOM=1;const HD=2;const H=540;let ROT=false;const stage=document.getElementById('stage');

function fit(){

 const dpr=Math.min(3,window.devicePixelRatio||1);let bw=Math.round(cw*dpr);if(bw>3000)bw=3000;if(bw<W)bw=W;
 cv.width=bw;cv.height=Math.round(bw*H/W);SCALE=cv.width/W;ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
 const tip=document.getElementById('tip');if(ROT&&!fit.tipped){fit.tipped=1;tip.textContent='📱 휴대폰을 옆으로 돌려서 하세요';tip.style.display='block';setTimeout(()=>tip.style.display='none',3500)}}
addEventListener('resize',fit);fit();

/* ---------- 이미지 ---------- */

/* ---------- 저장 (계속 쌓이는 것) ---------- */
const SAVE_KEY='sprout_v1';
const DEF={inv:{},qk:{},qdone:{},qon:[],cleared:{},lastSeen:0,bakery:0,lv:1,exp:0,gold:0,friends:['fox','sheep','bunny'],party:['fox','sheep','bunny'],fstar:{fox:1,sheep:1,bunny:1},stars:{},best:{},kills:0,bestCombo:0,plays:0,job:0};
let SV;try{SV=Object.assign({},DEF,JSON.parse(localStorage.getItem(SAVE_KEY)||'{}'));}catch(e){SV=Object.assign({},DEF)}

const expNeed=lv=>Math.round(40*Math.pow(lv,1.45));

/* ---------- 친구 정의 ---------- */
const FR={
 fox:{n:'여우 궁수',role:'원거리',img:'fox',col:'#e98a3c'},
 sheep:{n:'양 방패병',role:'탱커',img:'sheep',col:'#efe3c4'},
 bunny:{n:'분홍 토끼',role:'회복',img:'bunny',col:'#f3a6b5'},
 hedgehog:{n:'고슴도치 검사',role:'돌격',img:'hedgehog',col:'#8a6a4a'},

};
const ORDER=['fox','sheep','bunny','hedgehog','owl','frog'];

function bookPct(){const m=Object.keys(SV.mset||{}).length,i=Object.keys(SV.iset||{}).length,f=SV.friends.length;const tot=Object.keys(ENEMY).length+Object.keys(ITEMS).length+ORDER.length;return Math.round((m+i+f)/tot*100)}
function bookTitle(){const p=bookPct();return p>=100?'🌳 숲의 기록자':p>=75?'🌼 꽃길 탐험가':p>=50?'🌿 새싹 수집가':p>=25?'🌱 호기심 새싹':'—'}
function bookBonus(){const p=bookPct();return (p>=25?.02:0)+(p>=50?.02:0)+(p>=75?.02:0)+(p>=100?.04:0)}
function synergy(){const P=(SV.party||[]).slice(0,3);return SYN.find(s=>s.ks.every(k=>P.includes(k)))||null}

/* ---------- 입력 ---------- */
const K={left:0,right:0,up:0,down:0,jump:0,atk:0,skill:0,friend:0};const P={};
const KEYMAP={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',KeyA:'left',KeyD:'right',KeyW:'up',KeyS:'down',KeyC:'jump',Space:'jump',KeyX:'atk',KeyJ:'atk',KeyZ:'skill',KeyK:'skill',KeyV:'friend',Digit1:'d1',Digit2:'d2',Digit3:'d3',Digit4:'d4',Digit5:'d5',KeyL:'friend',Enter:'atk'};
addEventListener('keydown',e=>{const k=KEYMAP[e.code];if(k){if(!K[k])P[k]=1;K[k]=1;e.preventDefault();audioInit();}});
addEventListener('keyup',e=>{const k=KEYMAP[e.code];if(k){K[k]=0;}});
document.querySelectorAll('.btn').forEach(b=>{const k=b.dataset.k;
 const on=e=>{e.preventDefault();if(!K[k])P[k]=1;K[k]=1;b.classList.add('on');audioInit();};
 const off=e=>{e.preventDefault();K[k]=0;b.classList.remove('on');};
 b.addEventListener('touchstart',on,{passive:false});b.addEventListener('touchend',off,{passive:false});b.addEventListener('touchcancel',off,{passive:false});
 b.addEventListener('mousedown',on);b.addEventListener('mouseup',off);b.addEventListener('mouseleave',off);});
let tapXY=null,JOY;
function toLocal(cx,cy){return ROT?{x:cy,y:innerWidth-cx}:{x:cx,y:cy}}
function toCanvas(cx,cy){const l=toLocal(cx,cy);const k=cv.clientWidth/W;return {x:(l.x-cv.offsetLeft)/k,y:(l.y-cv.offsetTop)/k}}
cv.addEventListener('pointerdown',e=>{tapXY=toCanvas(e.clientX,e.clientY);audioInit();goFull();});
let fullTried=0;function goFull(){if(fullTried||!isTouch)return;fullTried=1;try{const d=document.documentElement;const r=d.requestFullscreen?d.requestFullscreen({navigationUI:'hide'}):null;if(r&&r.then)r.then(()=>{try{screen.orientation.lock('landscape').catch(()=>{})}catch(e){}}).catch(()=>{})}catch(e){}}
/* 조이스틱 */
const joy=document.getElementById('joy'),jb=document.getElementById('joyBase'),knob=document.getElementById('knob');let joyId=null,joyO=null;JOY={x:0,y:0,on:0};
function joySet(dx,dy){const r=Math.hypot(dx,dy),m=46;if(r>m){dx*=m/r;dy*=m/r}knob.style.transform='translate('+dx+'px,'+dy+'px)';JOY.x=dx/m;JOY.y=dy/m;
 const L=JOY.x<-.35,R=JOY.x>.35,U=JOY.y<-.55,D=JOY.y>.55;if(L&&!K.left)P.left=1;if(R&&!K.right)P.right=1;if(U&&!K.up)P.up=1;if(D&&!K.down)P.down=1;K.left=L?1:0;K.right=R?1:0;K.up=U?1:0;K.down=D?1:0;}
joy.addEventListener('touchstart',e=>{e.preventDefault();audioInit();goFull();const t=e.changedTouches[0];joyId=t.identifier;const l=toLocal(t.clientX,t.clientY);const jr=joy.getBoundingClientRect();
 const ox=l.x-joy.offsetLeft,oy=l.y-joy.offsetTop;jb.style.left=ox+'px';jb.style.top=oy+'px';jb.style.bottom='auto';jb.classList.add('on');joyO=l;JOY.on=1;joySet(0,0)},{passive:false});
joy.addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches)if(t.identifier===joyId){const l=toLocal(t.clientX,t.clientY);joySet(l.x-joyO.x,l.y-joyO.y)}},{passive:false});
const joyEnd=e=>{for(const t of e.changedTouches)if(t.identifier===joyId){joyId=null;JOY.on=0;joySet(0,0);jb.classList.remove('on');jb.style.left='110px';jb.style.top='auto';jb.style.bottom='30px';knob.style.transform=''}};
joy.addEventListener('touchend',joyEnd);joy.addEventListener('touchcancel',joyEnd);
document.getElementById('bAuto').addEventListener('touchstart',e=>{e.preventDefault();SV.auto=!SV.auto;save();e.currentTarget.classList.toggle('act',SV.auto)},{passive:false});
document.getElementById('bAuto').addEventListener('mousedown',e=>{SV.auto=!SV.auto;save();e.currentTarget.classList.toggle('act',SV.auto)});
function pressed(k){if(P[k]){P[k]=0;return true}return false}

/* ---------- 소리 (작고 부드럽게) ---------- */
let AC=null;function audioInit(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();sndLoad();if(typeof bgmStart==='function')bgmStart();}
function beep(f,d,type,vol,slide){if(!AC)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f*slide),t+d);g.gain.setValueAtTime(vol||.08,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02);}
function noise(d,vol){if(!AC)return;const t=AC.currentTime,len=Math.floor(AC.sampleRate*d),b=AC.createBuffer(1,len,AC.sampleRate),ch=b.getChannelData(0);for(let i=0;i<len;i++)ch[i]=(Math.random()*2-1)*(1-i/len);const s=AC.createBufferSource(),g=AC.createGain(),f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=1800;s.buffer=b;g.gain.value=vol||.12;s.connect(f);f.connect(g);g.connect(AC.destination);s.start(t);}
/* 효과음 샘플 (Kenney Impact Sounds, CC0) */
const SND={};const SNDN=['impactPunch_medium_000','impactPunch_medium_001','impactPunch_heavy_000','impactPunch_heavy_001','impactSoft_medium_000','impactSoft_heavy_000','impactWood_heavy_000','impactWood_medium_000','impactTin_medium_000','impactGeneric_light_000'];
function sndLoad(){if(!AC||sndLoad.done)return;sndLoad.done=1;SNDN.forEach(n=>fetch('sfx/'+n+'.mp3').then(r=>r.arrayBuffer()).then(b=>AC.decodeAudioData(b)).then(buf=>{SND[n]=buf}).catch(()=>{}))}
function play(n,vol,rate){if(!AC||!SND[n]||SV.mute&&false)return false;const s=AC.createBufferSource(),g=AC.createGain();s.buffer=SND[n];s.playbackRate.value=rate||1;g.gain.value=vol==null?.5:vol;s.connect(g);g.connect(AC.destination);s.start();return true}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
let BGM=null;function bgmStart(){if(!AC||BGM||SV.mute)return;const notes=[[60,64,67,72],[55,59,62,67],[57,60,64,69],[53,57,60,65]];const m=n=>440*Math.pow(2,(n-69)/12);let step=0;const g=AC.createGain();g.gain.value=.5;g.connect(AC.destination);
 const tick=()=>{if(SV.mute){return}const ch=notes[Math.floor(step/8)%4];const t=AC.currentTime+.02;const f=m(ch[[0,1,2,3,2,1,2,3][step%8]]+12);
  const o=AC.createOscillator(),gg=AC.createGain();o.type='triangle';o.frequency.value=f;gg.gain.setValueAtTime(.022,t);gg.gain.exponentialRampToValueAtTime(.0001,t+.5);o.connect(gg);gg.connect(g);o.start(t);o.stop(t+.55);
  if(step%8===0){const b=AC.createOscillator(),bg=AC.createGain();b.type='sine';b.frequency.value=m(ch[0]-12);bg.gain.setValueAtTime(.05,t);bg.gain.exponentialRampToValueAtTime(.0001,t+2.4);b.connect(bg);bg.connect(g);b.start(t);b.stop(t+2.5);}
  step++;BGM.tm=setTimeout(tick,330)};BGM={g};tick();}
function bgmStop(){if(BGM){clearTimeout(BGM.tm);BGM=null}}
const SFX={hit:(n,heavy,friend)=>{if(play(friend?'impactSoft_medium_000':heavy?pick(['impactPunch_heavy_000','impactPunch_heavy_001']):pick(['impactPunch_medium_000','impactPunch_medium_001']),friend?.28:heavy?.75:.55,(friend?1.1:1)+Math.min(n,12)*.012+Math.random()*.06)){if(n>=5&&!friend)beep(1300+n*40,.05,'sine',.018,1.2);return}noise(.06,.16);beep(95,.12,'sine',.16,.5);beep(240+n*28+Math.random()*40,.07,'triangle',.06,.5)},big:()=>{if(play('impactWood_heavy_000',.8,.85))return;noise(.18,.22);beep(110,.25,'sine',.14,.4)},jump:()=>beep(420,.12,'sine',.05,1.6),swing:()=>{if(!AC)return;const t=AC.currentTime,d=.13,len=Math.floor(AC.sampleRate*d),b=AC.createBuffer(1,len,AC.sampleRate),ch=b.getChannelData(0);for(let i=0;i<len;i++)ch[i]=(Math.random()*2-1)*Math.sin(Math.PI*i/len);const src=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();f.type='bandpass';f.Q.value=1.2;f.frequency.setValueAtTime(2600,t);f.frequency.exponentialRampToValueAtTime(700,t+d);g.gain.value=.16;src.buffer=b;src.connect(f);f.connect(g);g.connect(AC.destination);src.start(t)},lv:()=>{[523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.18,'triangle',.07),i*90))},heal:()=>beep(880,.2,'sine',.05,1.3),skill:()=>{beep(330,.3,'sawtooth',.04,2.2);noise(.25,.08)},get:()=>{[784,988,1318].forEach((f,i)=>setTimeout(()=>beep(f,.15,'sine',.06),i*80))},hurt:()=>beep(180,.15,'square',.05,.6),coin:()=>beep(1200,.06,'sine',.04,1.4)};

/* ---------- 스테이지 (메이플식 여러 층 + 넝쿨) ---------- */
const GROUND=470;
const REGIONS={
 forest:{n:'버섯 숲',ic:'🍄',bg:'bg_forest',e:['e0','e1','e2','e3'],boss:'boss',bossN:'시든 고목 골렘',lv:1},

};
function makeStage(region){
 if(region==='village'){const len=2400;return {len,plats:[{x:-200,y:GROUND,w:len+400,ground:1}],vines:[],zones:[],village:1};}
 const R=REGIONS[region],E=R.e;const len=4200;
 const plats=[{x:-200,y:GROUND,w:len+400,ground:1}];
 const vines=[];
 const set=region==='marsh'?[[260,360,200],[560,280,220],[880,370,180],[1180,300,200],[1500,250,240],[1780,360,200],[2100,290,220],[2440,370,180],[2720,280,240],[3060,350,220],[3380,270,200]]
  :[[300,370,220],[620,290,180],[900,360,200],[1250,300,240],[1600,380,160],[1820,290,220],[2200,350,240],[2520,270,200],[2850,360,220],[3200,300,240],[3520,380,180]];
 set.forEach(([x,y,w],i)=>{plats.push({x,y,w});if(y<300&&i%4===1)vines.push({x:x+w*0.5,y1:y+6,y2:GROUND-4});});

}

let ST,scene='title',titleT=0;

 for(const s of ST.shots){s.life-=dt;if(s.grav)s.vy+=900*dt;s.x+=s.vx*dt;s.y+=(s.vy||0)*dt;
  if(s.enemy){const p=ST.pl;if(Math.abs(p.x-s.x)<22&&s.y>p.y-p.h&&s.y<p.y+4){hurtPlayer(s.dmg,s.x);s.life=0}if(s.y>GROUND)s.life=0;continue}
  for(const e of ST.ents){if(e.dead||e.spawnT>0)continue;if(s.hitSet&&s.hitSet.has(e))continue;
   if(Math.abs(e.x-s.x)<s.r+18&&s.y>e.y-e.d.h-s.r&&s.y<e.y+s.r){
    dealHits({x1:e.x-1,x2:e.x+1,y1:e.y-e.d.h,y2:e.y},s.dmg,{kb:s.mine?260:90,stun:.35,fromFriend:s.from,dir:Math.sign(s.vx)||1,col:s.kind==='leaf'?'#cdeaa0':'#ffe0b0',leaf:s.kind==='leaf',mpGain:s.mine?4:0});
    if(s.pierce){(s.hitSet=s.hitSet||new Set()).add(e)}else{s.life=0;break}}
  }}
 ST.shots=ST.shots.filter(s=>s.life>0);
}

 const S=ST.S,p=ST.pl;const z=S.zones[ST.zone];if(!z)return;
 const alive=ST.ents.filter(e=>!e.dead&&!e.field).length;
 if(!ST.waveOn&&p.x>z.x+80){
  if(z.boss){const R=REGIONS[REGION];ST.lock={a:z.x,b:S.len};ST.waveOn=true;const b=spawn(R.boss,z.x+520,GROUND);b.spawnT=1.2;banner('보스: '+R.bossN,'콤보로 몰아붙여요!');SFX.big();shake(6);return}
  ST.lock={a:z.x-200,b:z.x+760};ST.waveOn=true;ST.waveIdx=0;spawnWave(z.waves[0],z);
 }
 if(ST.waveOn&&!z.boss&&alive===0){
  ST.waveIdx++;
  if(ST.waveIdx<z.waves.length){spawnWave(z.waves[ST.waveIdx],z);}
  else{ST.waveOn=false;ST.lock=null;ST.zone++;const nz=S.zones[ST.zone];

   SFX.get();}
 }
}
function spawnWave(w,z){for(let i=0;i<w.length;i+=2){const t=w[i],n=w[i+1];for(let j=0;j<n;j++){const side=(ST.pl.x-z.x<320||Math.random()<.85)?1:-1;const x=ST.pl.x+side*(260+Math.random()*260);const plat=ST.S.plats.filter(p=>!p.ground&&x>p.x&&x<p.x+p.w);const y=(plat.length&&Math.random()<.35)?plat[0].y:GROUND;const e=spawn(t,Math.max(z.x-180,Math.min(z.x+740,x)),y);e.spawnT=.5+j*.15}}}

 if(q.kill){const b=(SV.qbase&&SV.qbase[id])||0;return [Math.min(q.kill[1],(SV.qk[q.kill[0]]||0)-b),q.kill[1]]}

 return q.cond()}

const DPOOL=[{id:'kill',n:'몬스터 40마리 쉬게 하기',g:40},{id:'combo',n:'한 판에 콤보 30 이상',g:30},{id:'srank',n:'S 랭크로 클리어',g:1},{id:'clear',n:'지역 2번 클리어',g:2},{id:'card',n:'전술 카드 5장 쓰기',g:5},{id:'duel',n:'카드 대전 1승',g:1},{id:'nohit',n:'피해 30 이하로 클리어',g:1}];
function dayKey(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function daily(){const k=dayKey();if(!SV.daily||SV.daily.day!==k){let seed=k.split('-').reduce((a,b)=>a*31+(+b),7);const pool=DPOOL.slice();const L=[];for(let i=0;i<3;i++){seed=(seed*9301+49297)%233280;L.push(Object.assign({p:0,c:0},pool.splice(seed%pool.length,1)[0]))}SV.daily={day:k,L,streak:(SV.daily&&SV.daily.allDone===SV.daily.day)?(SV.daily.streak||0):0};}return SV.daily}
function dprog(id,v,set){const D=daily();for(const q of D.L)if(q.id===id&&!q.c){q.p=set?Math.max(q.p,v):q.p+v;if(q.p>=q.g&&!q.done){q.done=1;logMsg('📋 오늘의 의뢰 달성: '+q.n,'#9be38a');SFX.get()}}}
function dailyClaimable(){return daily().L.some(q=>q.done&&!q.c)}
function talkBoard(){const D=daily();const T={who:'board',name:'마을 게시판',opts:[],text:'📋 오늘의 의뢰 (매일 새로 바뀌어요)\n'+D.L.map(q=>(q.c?'✅ ':q.done?'🎁 ':'▫ ')+q.n+'  '+Math.min(q.p,q.g)+'/'+q.g).join('\n')};
 D.L.forEach(q=>{if(q.done&&!q.c)T.opts.push({t:'🎁 보상: '+q.n.slice(0,10),ok:1,cb:()=>{q.c=1;SV.gold+=120;SV.inv.it_star=(SV.inv.it_star||0)+1;SFX.lv();if(D.L.every(x=>x.c)){SV.inv.it_chest=(SV.inv.it_chest||0)+1;}save();talkBoard();ST.dlg.text='보상: 🪙120 · 별 조각 1'+(D.L.every(x=>x.c)?' · 3개 모두 완료! 보물 상자 +1':'')}})});
