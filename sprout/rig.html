<!doctype html><html><head><meta charset="utf-8"><title>rig test</title><style>body{margin:0;background:#e8efe0}</style></head><body>
<canvas id="c" width="1600" height="700"></canvas>
<script src="rig.js"></script>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
window.renderGrid=function(mode,n,h){ctx.fillStyle='#e8efe0';ctx.fillRect(0,0,c.width,c.height);
 for(let i=0;i<n;i++){const x=100+(i%8)*190,y=320+Math.floor(i/8)*340;ctx.strokeStyle='#c99';ctx.beginPath();ctx.moveTo(x-80,y);ctx.lineTo(x+80,y);ctx.stroke();
  const P=SPROUT_RIG.pose(mode,i/n,i*.2,1);SPROUT_RIG.draw(ctx,x,y,h||260,1,P);ctx.fillStyle='#333';ctx.fillText(mode+' '+i,x-70,y+16)}}
</script></body></html>
