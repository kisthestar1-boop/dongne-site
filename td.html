<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>동네 지킴이 디펜스</title>
<meta name="theme-color" content="#1F3A2A">
<link rel="manifest" href="td-manifest.json">
<link rel="icon" href="td-icon-192.png">
<link rel="apple-touch-icon" href="td-icon-192.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#1F3A2A;color:#fff;font-family:"Noto Sans KR",system-ui,sans-serif;overflow:hidden;user-select:none;touch-action:none}
#wrap{position:fixed;inset:0;display:flex;flex-direction:column}
#hud{position:absolute;left:0;right:0;top:0;z-index:3;display:flex;gap:6px;align-items:center;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;font-weight:800;font-size:.88rem;max-width:560px;margin:0 auto}
#hud .p{background:rgba(10,20,14,.55);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.12);border-radius:99px;padding:5px 11px;white-space:nowrap}
#hud .sp{flex:1}
#hud button{white-space:nowrap;border:0;border-radius:99px;padding:7px 12px;font-weight:800;font-size:.82rem;font-family:inherit;background:linear-gradient(#FFE08A,#F5BD3A);color:#3A2A10;box-shadow:0 2px 0 #B98516}
#hud button.g{background:rgba(10,20,14,.55);color:#fff;box-shadow:none;border:1px solid rgba(255,255,255,.12);padding:7px 10px}
#stage{position:relative;flex:1;min-height:0}
#stage canvas{display:block;touch-action:none}
#bar{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px 10px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(rgba(10,20,14,0),rgba(10,20,14,.65) 30%);max-width:560px;width:100%;margin:0 auto}
.tw{border:2px solid rgba(255,255,255,.08);border-radius:14px;background:rgba(255,255,255,.1);padding:5px 2px;text-align:center;color:#fff;font-weight:700;font-size:.66rem;font-family:inherit}
.tw.on{border-color:#FFD66B;background:rgba(255,214,107,.2)}
.tw.no{opacity:.4}
.tw canvas{display:block;margin:0 auto 2px;width:34px;height:34px}
.tw b{display:block;font-size:.7rem;color:#FFD66B}
#pop{position:fixed;display:none;background:#FFF8EC;color:#3A2A20;border-radius:14px;padding:9px;box-shadow:0 10px 28px rgba(0,0,0,.45);font-size:.78rem;z-index:5;min-width:160px}
#pop b{display:block;margin-bottom:4px;font-size:.86rem}
#pop .buf{color:#2F8A55;font-weight:700}
#pop button{display:block;width:100%;margin-top:6px;border:0;border-radius:10px;padding:8px;font-weight:800;font-size:.8rem;font-family:inherit;background:#3A2A20;color:#fff}
#pop button.s{background:#EADBCD;color:#3A2A20}
#ov{position:fixed;inset:0;background:radial-gradient(rgba(15,30,20,.55),rgba(10,20,14,.88));display:flex;align-items:center;justify-content:center;padding:20px;z-index:9}
#ov.off{display:none}
.box{background:#FFF8EC;color:#3A2A20;border-radius:22px;padding:22px 18px;max-width:390px;width:100%;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.4)}
.box h1{margin:4px 0 2px;font-size:1.45rem}.box p{margin:8px 0;color:#6B5A4C;font-size:.88rem;line-height:1.55}
.box button{width:100%;margin-top:10px;border:0;border-radius:14px;padding:13px;font-weight:800;font-size:1rem;font-family:inherit;background:linear-gradient(#3E8A45,#2F6B34);color:#fff;box-shadow:0 3px 0 #1F4A23}
.box button.s{background:#EADBCD;color:#3A2A20;box-shadow:none}
.stars{font-size:1.8rem;letter-spacing:4px;color:#E9A93A}
.lv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.lv button{margin:0;padding:12px 4px;font-size:.82rem}
.lv button.lock{background:#CFC2B4;color:#8A7A6C;box-shadow:none}
.crew{display:flex;justify-content:center;gap:4px;margin:6px 0 2px}
.crew canvas{width:44px;height:44px}
#toast{position:fixed;left:50%;top:calc(58px + env(safe-area-inset-top));transform:translateX(-50%);background:rgba(10,20,14,.7);padding:7px 14px;border-radius:99px;font-weight:800;font-size:.85rem;opacity:0;transition:opacity .3s;pointer-events:none;z-index:6;white-space:nowrap}
#toast.on{opacity:1}
#fl{position:fixed;inset:0;pointer-events:none;z-index:4}
.num{position:absolute;font-weight:900;font-size:15px;color:#FFE27A;text-shadow:0 2px 0 rgba(0,0,0,.45);transform:translate(-50%,-50%);white-space:nowrap}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#1F3A2A;z-index:20;font-weight:800}
</style></head>
<body>
<div id="wrap">
  <div id="hud"><span class="p" id="hp">❤️ 20</span><span class="p" id="gd">🪙 120</span><span class="p" id="wv">🌊 0/10</span><span class="sp"></span><button class="g" id="snd">🔊</button><button class="g" id="spd">1x</button><button id="go">▶ 시작</button></div>
  <div id="stage"></div>
  <div id="bar"></div>
</div>
<div id="fl"></div>
<div id="pop"></div>
<div id="toast"></div>
<div id="ov" class="off"></div>
<div id="load">동네를 짓는 중…</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>window.THREE||document.write('<script src="three.min.js"><\/script>')</script>
<script>
(()=>{
const $=s=>document.querySelector(s);
/* ===== 데이터 ===== */
const TW={
  ig:{n:"일굼이",d:"물뿌리개로 느리게",c:50,col:"#7CC07F",r:2.3,rate:0.9,dmg:6,slow:.45,face:"#F2CFAE",hat:"#E9C46A"},
  ds:{n:"대심이",d:"빠른 연사",c:70,col:"#5EC8FF",r:2.6,rate:0.28,dmg:7,face:"#F4D3B5",hat:"#3B2E2A",glasses:1},
  kj:{n:"키잡이",d:"대포·범위 피해",c:110,col:"#F1C24B",r:2.9,rate:1.6,dmg:26,splash:1.1,face:"#F4D3B5",hat:"#26406B"},
  bg:{n:"곳간이",d:"처치하면 동전 +",c:90,col:"#B79BEA",r:2.4,rate:0.7,dmg:9,bonus:3,face:"#F4D3B5",hat:"#7E5BC2"}
};
const EN={
  bug:{hp:26,sp:1.15,gold:5,col:"#7A5A3A",sz:.28,n:"벌레"},
  mole:{hp:70,sp:.75,gold:9,col:"#8B6B5A",sz:.36,n:"두더지"},
  bee:{hp:20,sp:1.9,gold:6,col:"#F2B632",sz:.24,n:"말벌"},
  crow:{hp:420,sp:.62,gold:60,col:"#3A3A4A",sz:.5,boss:1,n:"까마귀 대장"}
};
const COLS=9,ROWS=13;
const LEVELS=[
 {name:"공원 산책로",path:[[0,2],[6,2],[6,6],[2,6],[2,10],[8,10],[8,12]],g1:"#79B85C",g2:"#6FAE53",rim:"#5E9A47",water:"#4BA3C7"},
 {name:"장유 골목",path:[[4,0],[4,3],[1,3],[1,7],[7,7],[7,4],[5,4],[5,10],[2,10],[2,12]],g1:"#8BBF5E",g2:"#7EB452",rim:"#6C9E45",water:"#5AA8C4"},
 {name:"율하 강변",path:[[0,1],[8,1],[8,4],[0,4],[0,8],[8,8],[8,11],[3,11],[3,12]],g1:"#6DB37A",g2:"#62A86F",rim:"#4F9460",water:"#3E95C4"}
];
function wavesFor(L){const w=[];for(let i=1;i<=10;i++){const list=[];const k=1+L*0.35+i*0.22;
  const n=6+i*2;for(let j=0;j<n;j++){const t=i>=4&&j%4==3?"mole":i>=3&&j%3==2?"bee":"bug";list.push([t,k])}
  if(i%5==0)list.push(["crow",k]);w.push(list)}return w}
let lvl=0,G,sel="ig",spd=1,paused=true,last=0,sound=true;
let prog={};try{prog=JSON.parse(localStorage.getItem("tdProg")||"{}")}catch(e){}
try{sound=localStorage.getItem("tdSnd")!=="0"}catch(e){}
function save(){try{localStorage.setItem("tdProg",JSON.stringify(prog))}catch(e){}}
function cells(path){const s=new Set();for(let i=0;i<path.length-1;i++){let[a,b]=path[i],[c,d]=path[i+1];const dx=Math.sign(c-a),dy=Math.sign(d-b);while(a!==c||b!==d){s.add(a+","+b);a+=dx;b+=dy}}const e=path[path.length-1];s.add(e[0]+","+e[1]);return s}

/* ===== 소리 (작고 부드럽게) ===== */
let AC=null;
function tone(f,dur,type,vol,slide){if(!sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type||"sine";o.frequency.setValueAtTime(f,AC.currentTime);if(slide)o.frequency.exponentialRampToValueAtTime(slide,AC.currentTime+dur);
  g.gain.setValueAtTime(vol||.05,AC.currentTime);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+dur);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+dur)}catch(e){}}
const sfx={place:()=>{tone(520,.12,"triangle",.06,780)},coin:()=>{tone(880,.08,"square",.018);setTimeout(()=>tone(1320,.1,"square",.015),60)},boom:()=>tone(140,.25,"sine",.08,60),hurt:()=>tone(220,.3,"sawtooth",.03,110),boss:()=>{tone(110,.5,"sawtooth",.04,90)},win:()=>{[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.18,"triangle",.06),i*120))}};
let coinT=0;

/* ===== 3D 기본 ===== */
const stage=$("#stage");
const R=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});
R.setPixelRatio(Math.min(devicePixelRatio,2));R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;
R.outputColorSpace=THREE.SRGBColorSpace;R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=1.08;
stage.appendChild(R.domElement);
const S=new THREE.Scene();S.background=new THREE.Color("#9FD4EA");S.fog=new THREE.Fog("#9FD4EA",26,60);
const cam=new THREE.PerspectiveCamera(36,1,.1,120);
S.add(new THREE.HemisphereLight("#E6F4FF","#5C7A3E",1.05));
const sun=new THREE.DirectionalLight("#FFF0D2",2.1);sun.position.set(-6,14,8);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);const sc=sun.shadow.camera;sc.left=-10;sc.right=10;sc.top=12;sc.bottom=-12;sc.near=1;sc.far=40;sun.shadow.bias=-.0006;sun.shadow.normalBias=.02;S.add(sun);
const fill=new THREE.DirectionalLight("#BFD8FF",.35);fill.position.set(8,6,-6);S.add(fill);

const matCache={};
function M(c,o){const k=c+JSON.stringify(o||{});if(!matCache[k])matCache[k]=new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.78,metalness:0},o||{}));return matCache[k]}
function mesh(g,m,x,y,z,sh){const o=new THREE.Mesh(g,m);o.position.set(x||0,y||0,z||0);if(sh!==false){o.castShadow=true;o.receiveShadow=true}return o}
const GEO={
  sph:new THREE.SphereGeometry(1,20,14),half:new THREE.SphereGeometry(1,20,10,0,Math.PI*2,0,Math.PI/2),
  cyl:new THREE.CylinderGeometry(1,1,1,20),box:new THREE.BoxGeometry(1,1,1),cone:new THREE.ConeGeometry(1,1,16),
  rock:new THREE.DodecahedronGeometry(1,0),tor:new THREE.TorusGeometry(1,.22,8,20),ring:new THREE.RingGeometry(.92,1,48),disc:new THREE.CircleGeometry(1,40)
};
function S3(o,x,y,z){o.scale.set(x,y==null?x:y,z==null?x:z);return o}
const W2=(cx,cy)=>[cx-COLS/2,cy-ROWS/2]; // 셀 단위 좌표 → 월드

/* ===== 맵 만들기 ===== */
let world=null,cafe=null,flowers={},water=null;
function rnd(seed){let s=seed;return()=>{s=(s*16807)%2147483647;return(s-1)/2147483646}}
function buildWorld(L){if(world){S.remove(world);world.traverse(o=>{if(o.geometry&&!Object.values(GEO).includes(o.geometry))o.geometry.dispose()})}
  world=new THREE.Group();S.add(world);flowers={};const lv=LEVELS[L],r=rnd(97+L*31),road=cells(lv.path);
  // 물
  water=mesh(new THREE.PlaneGeometry(140,140),new THREE.MeshStandardMaterial({color:lv.water,roughness:.25,metalness:.1,transparent:true,opacity:.92}),0,-.62,0,false);water.rotation.x=-Math.PI/2;water.receiveShadow=true;world.add(water);
  // 섬 (흙 + 잔디 테두리)
  const IW=COLS+3.2,ID=ROWS+3.2;
  world.add(mesh(new THREE.BoxGeometry(IW,1,ID),M("#8A6A48"),0,-.72,0));
  world.add(mesh(new THREE.BoxGeometry(IW+.02,.12,ID+.02),M(lv.rim),0,-.2,0));
  world.add(mesh(new THREE.BoxGeometry(IW-.6,.6,ID-.6),M("#6E5238"),0,-1.25,0));
  // 타일 (인스턴싱)
  const nG=COLS*ROWS-road.size,gI=new THREE.InstancedMesh(new THREE.BoxGeometry(.97,.3,.97),M("#ffffff"),nG),rI=new THREE.InstancedMesh(new THREE.BoxGeometry(1,.22,1),M("#ffffff",{roughness:.95}),road.size);
  gI.receiveShadow=rI.receiveShadow=true;gI.castShadow=false;
  const m4=new THREE.Matrix4(),col=new THREE.Color();let gi=0,ri=0;
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){const[wx,wz]=W2(x+.5,y+.5);
    if(road.has(x+","+y)){m4.makeTranslation(wx,-.19,wz);rI.setMatrixAt(ri,m4);col.set("#E3CB9C").offsetHSL(0,0,(r()-.5)*.05);rI.setColorAt(ri++,col)}
    else{m4.makeTranslation(wx,-.15,wz);gI.setMatrixAt(gi,m4);col.set((x+y)%2?lv.g1:lv.g2).offsetHSL((r()-.5)*.01,0,(r()-.5)*.04);gI.setColorAt(gi++,col);
      if(r()<.45){const fg=new THREE.Group();const fc=["#FFFFFF","#FFD66B","#F49AB4","#B9A3F0"][Math.floor(r()*4)];
        for(let i=0;i<3;i++){const a=r()*6.28,d=.12+r()*.25;fg.add(S3(mesh(GEO.sph,M(fc),Math.cos(a)*d,.04,Math.sin(a)*d,false),.035));fg.add(mesh(new THREE.CylinderGeometry(.008,.008,.06),M("#3F7A35"),Math.cos(a)*d,.01,Math.sin(a)*d,false))}
        for(let i=0;i<4;i++){const t=mesh(GEO.cone,M("#4E8F3E"),(r()-.5)*.7,.035,(r()-.5)*.7,false);S3(t,.025,.08,.025);fg.add(t)}
        fg.position.set(wx,0,wz);world.add(fg);flowers[x+","+y]=fg}}}
  world.add(gI,rI);
  // 길 가장자리 작은 돌
  for(const k of road){const[x,y]=k.split(",").map(Number);for(let i=0;i<2;i++){if(r()<.5)continue;const[wx,wz]=W2(x+.15+r()*.7,y+.15+r()*.7);const p=S3(mesh(GEO.rock,M("#CDB894"),wx,-.07,wz),.035+r()*.03);p.rotation.set(r()*3,r()*3,0);world.add(p)}}
  // 테두리 장식: 나무·덤불·바위
  const deco=(x,z)=>{const t=r();if(t<.5)world.add(tree(x,z,.75+r()*.5));else if(t<.8)world.add(bush(x,z));else{const k=S3(mesh(GEO.rock,M("#9A9A92"),x,-.08,z),.18+r()*.15,.13+r()*.1,.18+r()*.12);k.rotation.y=r()*3;world.add(k)}};
  for(let x=-IW/2+.5;x<=IW/2-.4;x+=.75){deco(x+(r()-.5)*.3,-ID/2+.55+r()*.3);deco(x+(r()-.5)*.3,ID/2-.55-r()*.3)}
  for(let z=-ID/2+1.3;z<=ID/2-1.3;z+=.8){deco(-IW/2+.55+r()*.3,z+(r()-.5)*.3);deco(IW/2-.55-r()*.3,z+(r()-.5)*.3)}
  // 시작 굴
  const s0=lv.path[0],[sx,sz]=W2(s0[0]+.5,s0[1]+.5),hole=new THREE.Group();
  hole.add(S3(mesh(GEO.disc,M("#2A1E16",{roughness:1}),0,-.075,0,false),.34));hole.children[0].rotation.x=-Math.PI/2;
  for(let i=0;i<9;i++){const a=i/9*6.28,k=S3(mesh(GEO.rock,M(i%2?"#8E8A80":"#A39E92"),Math.cos(a)*.42,-.02,Math.sin(a)*.42),.11,.09,.11);k.rotation.set(r()*3,r()*3,0);hole.add(k)}
  hole.position.set(sx,0,sz);world.add(hole);
  // 카페
  const e=lv.path[lv.path.length-1],pe=lv.path[lv.path.length-2],ddx=Math.sign(e[0]-pe[0]),ddy=Math.sign(e[1]-pe[1]);
  const[ex,ez]=W2(e[0]+.5+ddx*1.05,e[1]+.5+ddy*1.05);cafe=makeCafe();cafe.position.set(ex,-.15,ez);cafe.scale.setScalar(1.35);cafe.rotation.y=Math.atan2(-ddx,-ddy);world.add(cafe);
  const ext=mesh(new THREE.BoxGeometry(1,.22,1),M("#E3CB9C",{roughness:.95}),0,0,0);const[mx,mz]=W2(e[0]+.5+ddx*.75,e[1]+.5+ddy*.75);ext.position.set(mx,-.19,mz);ext.scale.set(ddx?0.5:1,1,ddy?0.5:1);world.add(ext);
}
function tree(x,z,s){const g=new THREE.Group();g.add(S3(mesh(GEO.cyl,M("#7A5434"),0,.22,0),.06,.45,.06));
  const c=["#3F8A3C","#4C9A43","#367E39"];g.add(S3(mesh(GEO.sph,M(c[0]),0,.62,0),.3,.28,.3));g.add(S3(mesh(GEO.sph,M(c[1]),.12,.8,.05),.22));g.add(S3(mesh(GEO.sph,M(c[2]),-.1,.75,-.08),.2));
  g.position.set(x,-.15,z);g.scale.setScalar(s);g.rotation.y=Math.random()*6;return g}
function bush(x,z){const g=new THREE.Group();g.add(S3(mesh(GEO.sph,M("#4E9A45"),0,.1,0),.22,.17,.22));g.add(S3(mesh(GEO.sph,M("#5BAA4E"),.14,.08,.06),.14));
  if(Math.random()<.5)for(let i=0;i<3;i++)g.add(S3(mesh(GEO.sph,M("#E8575A"),(Math.random()-.5)*.3,.2,(Math.random()-.5)*.25,false),.03));g.position.set(x,-.15,z);return g}
function makeCafe(){const g=new THREE.Group();
  g.add(S3(mesh(GEO.box,M("#D9C3A4"),0,.04,0),.9,.08,.9));
  g.add(S3(mesh(GEO.box,M("#FFF3E0"),0,.36,0),.72,.56,.66));
  const roof=S3(mesh(GEO.cone,M("#C7593F"),0,.86,0),.62,.42,.62);roof.geometry=new THREE.ConeGeometry(1,1,4);roof.rotation.y=Math.PI/4;g.add(roof);g.userData.roof=roof;
  g.add(S3(mesh(GEO.box,M("#6B4630"),0,.24,.335),.18,.32,.02));
  for(let i=0;i<4;i++)g.add(S3(mesh(GEO.box,M(i%2?"#FFFFFF":"#E05A4F"),-.27+i*.18,.6,.38),.18,.05,.14));
  [-.22,.22].forEach(x=>g.add(S3(mesh(GEO.box,M("#9FD3F0",{roughness:.2,metalness:.2}),x,.38,.335),.15,.14,.015)));
  g.add(S3(mesh(GEO.box,M("#8A5A3A"),.22,1.02,0),.1,.22,.1));
  const cup=new THREE.Group();cup.add(S3(mesh(GEO.cyl,M("#FFFFFF"),0,0,0),.1,.12,.1));cup.add(S3(mesh(GEO.cyl,M("#6B3E26"),0,.055,0,false),.085,.01,.085));
  const h=S3(mesh(GEO.tor,M("#FFFFFF"),.11,0,0),.045);cup.add(h);cup.position.set(0,1.18,0);g.add(cup);g.userData.cup=cup;return g}

/* ===== 캐릭터 ===== */
function makeHero(k){const d=TW[k],g=new THREE.Group(),rig=new THREE.Group();
  g.add(S3(mesh(GEO.cyl,M("#D6C8B6"),0,.07,0),.4,.14,.4));g.add(S3(mesh(GEO.cyl,M(d.col),0,.15,0),.37,.04,.37));
  const lvG=new THREE.Group();g.add(lvG);g.userData.lvG=lvG;
  rig.position.y=.17;rig.scale.setScalar(1.55);g.add(rig);g.userData.rig=rig;
  const bodyC=new THREE.CapsuleGeometry(.17,.16,6,16);rig.add(mesh(bodyC,M(d.col),0,.25,0));
  rig.add(S3(mesh(GEO.sph,M(d.face),0,.56,0),.19));
  [-.065,.065].forEach(x=>{rig.add(S3(mesh(GEO.sph,M("#2A2420",{roughness:.3}),x,.58,.165,false),.028));rig.add(S3(mesh(GEO.sph,M("#FFFFFF"),x+.01,.592,.188,false),.008))});
  [-.11,.11].forEach(x=>rig.add(S3(mesh(GEO.sph,M("#F4A39A"),x,.52,.15,false),.03,.02,.02)));

  if(f.coin){f.m.position.y+=dt*1.6;f.m.rotation.z+=dt*9;f.m.material=f.m.material;f.m.scale.setScalar(.09*Math.min(1,k*2.5));f.m.scale.y=.025;continue}

function step(dt){if(paused||G.done)return;

    while(mv>0&&e.seg<P.length-1){const[tx,ty]=P[e.seg+1],dx=tx-e.x,dy=ty-e.y,L=Math.hypot(dx,dy);if(L<=mv){e.x=tx;e.y=ty;e.seg++;mv-=L}else{e.x+=dx/L*mv;e.y+=dy/L*mv;mv=0;e.dir=Math.atan2(dx,dy)}}
    if(e.seg>=P.length-1){e.hp=0;e.gone=1;G.hp-=d.boss?5:1;const[wx,wz]=W2(e.x,e.y);particle(wx,.3,wz,"#E7837B",8,1,.5,.05);cafe.userData.hit=.5;sfx.hurt()}}

    if(best){t.cd=s.rate;t.aim=best;t.kick=1;const[wx,wz]=W2(t.x+.5,t.y+.5),d=TW[t.k];
      const m=mesh(GEO.sph,new THREE.MeshBasicMaterial({color:t.k==="kj"?"#3A3D44":d.col}),wx,.75,wz,false);S3(m,t.k==="kj"?.09:.055);

      if(sh.splash){for(const en of G.en)if(Math.hypot(en.x-e.x,en.y-e.y)<=sh.splash)hit(en,sh.dmg);ringFx(wx,wz,sh.splash,"#FFD66B",.4);particle(wx,.1,wz,"#C9B48A",10,1.4,.5,.05,1.2);sfx.boom()}
      else{hit(e,sh.dmg);particle(wx,.3,wz,sh.slow?"#9EE6FF":sh.col,4,.8,.3,.03)}}
    else{sh.x+=dx/L*v;sh.y+=dy/L*v;sh.tr-=dt;

    if(t.kick>0){t.kick-=dt*6;rig.position.z=-Math.max(0,t.kick)*.04*Math.cos(rig.rotation.y);rig.position.x=-Math.max(0,t.kick)*.04*Math.sin(rig.rotation.y)}
    if(g.userData.au){g.userData.au.material.opacity=.3+Math.sin(clock*2)*.12;g.userData.ws.rotation.y+=dt*2;rig.rotation.y+=dt*.4}}
  for(const e of G.en){const g=e.mesh,[wx,wz]=W2(e.x,e.y);e.ph+=dt*(e.slowT>0?5:9);
    const fly=e.k==="bee"||e.k==="crow";g.position.set(wx,-.08+(fly?.15+Math.sin(e.ph*.5)*.04:Math.abs(Math.sin(e.ph))*.03),wz);
    if(e.dir!=null){let df=e.dir-g.rotation.y;df=Math.atan2(Math.sin(df),Math.cos(df));g.rotation.y+=df*Math.min(1,dt*10)}
    if(g.userData.w){const a=Math.sin(e.ph*(e.k==="bee"?3:.8));if(e.k==="bee"){g.userData.w[0].rotation.y=a*.6;g.userData.w[1].rotation.y=-a*.6}else{g.userData.w[0].rotation.z=a*.35;g.userData.w[1].rotation.z=-a*.35}}
    const bm=g.userData.body.material;e.flash=(e.flash||0)-dt;bm.emissive.set(e.flash>0?"#FFFFFF":e.slowT>0?"#3A8FC0":"#000000");bm.emissiveIntensity=e.flash>0?.7:e.slowT>0?.55:0;
    const hb=g.userData.hb,top=EN[e.k].boss?1.35:e.k==="mole"?.62:.55;hb.position.set(wx,top*1.45,wz);hb.visible=e.hp<e.max;const r=Math.max(0,e.hp/e.max);g.userData.fg.scale.x=.48*r;g.userData.fg.material.color.set(r>.5?"#7CE07F":r>.25?"#FFD66B":"#FF6A5A")}
  for(const s of G.shots){const[wx,wz]=W2(s.x,s.y);let rr=1;if(s.tg){rr=Math.min(1,Math.hypot(s.tg.x-s.x,s.tg.y-s.y)/s.d0)}const base=.3+(.75-.3)*rr;s.m.position.set(wx,base+(s.k==="kj"?Math.sin((1-rr)*Math.PI)*.8:0),wz)}}
function loop(t){const raw=Math.min(.05,(t-last)/1000||0);last=t;const dt=raw*spd;if(G){for(let i=0;i<spd;i++)step(dt/spd)}sync(raw*(paused?1:spd));stepFx(raw*(paused?1:spd));R.render(S,cam);requestAnimationFrame(loop)}

/* ===== 입력 ===== */
const ray=new THREE.Raycaster(),gp=new THREE.Plane(new THREE.Vector3(0,1,0),0),v2=new THREE.Vector2(),hit3=new THREE.Vector3();
function cellAt(ev){const r=R.domElement.getBoundingClientRect();v2.set((ev.clientX-r.left)/r.width*2-1,-(ev.clientY-r.top)/r.height*2+1);ray.setFromCamera(v2,cam);if(!ray.ray.intersectPlane(gp,hit3))return[-1,-1];return[Math.floor(hit3.x+COLS/2),Math.floor(hit3.z+ROWS/2)]}
function hover(x,y){if(!G||G.done||x<0||y<0||x>=COLS||y>=ROWS){hov.visible=false;if(!G||!G.pick)rng.visible=rngF.visible=false;return}
  const[wx,wz]=W2(x+.5,y+.5);hov.visible=true;hov.position.set(wx,.005,wz);const ok=canPlace(x,y);hov.material.color.set(ok?"#FFFFFF":"#FF6A5A");
  if(sel&&ok)showRange(wx,wz,TW[sel].r);else if(!G.pick)rng.visible=rngF.visible=false}
const cv=R.domElement;
cv.addEventListener("pointermove",e=>{if(e.pointerType==="mouse"){const[x,y]=cellAt(e);hover(x,y)}});
cv.addEventListener("pointerleave",()=>{hov.visible=false});
cv.addEventListener("pointerdown",e=>{if(!G||G.done)return;const[x,y]=cellAt(e);hidePop();if(x<0||y<0||x>=COLS||y>=ROWS){G.pick=null;rng.visible=rngF.visible=false;return}
  const t=G.towers.find(t=>t.x==x&&t.y==y);
  if(t){G.pick=t;const[wx,wz]=W2(x+.5,y+.5);showRange(wx,wz,stat(t).r);showPop(t,e);return}G.pick=null;
  if(!sel){hover(x,y);return}if(!canPlace(x,y)){toast("길 위에는 못 세워요");return}const d=TW[sel];if(G.gold<d.c){toast("동전이 부족해요");return}
  G.gold-=d.c;const nt={k:sel,x,y,lv:0,cd:0,spent:d.c,pop:0};nt.mesh=makeHero(sel);const[wx,wz]=W2(x+.5,y+.5);nt.mesh.position.set(wx,0,wz);nt.mesh.rotation.y=0;nt.mesh.scale.setScalar(.01);S.add(nt.mesh);G.towers.push(nt);
  if(flowers[x+","+y])flowers[x+","+y].visible=false;ringFx(wx,wz,.6,"#FFFFFF",.35);particle(wx,.05,wz,"#E8DCC0",8,1,.4,.035,1);sfx.place();
  if(sel==="cj")toast("✨ 최적이: 옆 칸 동료가 더 세져요");hover(x,y);hud()});
function upCost(t){return Math.round(TW[t.k].c*(0.8+t.lv*0.6))}
function showPop(t,e){const p=$("#pop"),d=TW[t.k],s=stat(t),uc=upCost(t);
  const info=t.k==="cj"?`옆 8칸 동료 공격력·공격 속도 <span class="buf">+${Math.round((.25+t.lv*.08)*100)}%</span>`:`공격력 ${Math.round(s.dmg)} · 사거리 ${s.r.toFixed(1)}${s.buff?`<br><span class="buf">✨ 최적이 강화 +${Math.round(s.buff*100)}%</span>`:""}`;
  p.innerHTML=`<b>${d.n} Lv.${t.lv+1}</b>${d.d}<br>${info}${t.lv<3?`<button data-up>⬆ 강화 🪙${uc}</button>`:"<button disabled>최대 강화</button>"}<button class="s" data-sell>판매 +🪙${Math.round(t.spent*.6)}</button>`;
  p.style.display="block";const Wd=p.offsetWidth,H=p.offsetHeight;p.style.left=Math.min(innerWidth-Wd-8,Math.max(8,e.clientX-Wd/2))+"px";p.style.top=Math.max(8,e.clientY-H-18)+"px";p.t=t}
function hidePop(){$("#pop").style.display="none"}
$("#pop").addEventListener("pointerdown",e=>{e.stopPropagation();const p=$("#pop"),t=p.t;if(!t)return;
  if(e.target.closest("[data-up]")){const c=upCost(t);if(G.gold<c){toast("동전이 부족해요");return}G.gold-=c;t.spent+=c;t.lv++;setLv(t);const[wx,wz]=W2(t.x+.5,t.y+.5);ringFx(wx,wz,.55,"#FFD66B",.4);particle(wx,.4,wz,"#FFD66B",10,.7,.6,.035,2);sfx.place();showRange(wx,wz,stat(t).r);
    showPop(t,{clientX:parseFloat(p.style.left)+p.offsetWidth/2,clientY:parseFloat(p.style.top)+p.offsetHeight+18});toast("⬆ 강화!");hud()}
  if(e.target.closest("[data-sell]")){G.gold+=Math.round(t.spent*.6);S.remove(t.mesh);if(flowers[t.x+","+t.y])flowers[t.x+","+t.y].visible=true;G.towers=G.towers.filter(x=>x!==t);G.pick=null;rng.visible=rngF.visible=false;hidePop();hud()}});
document.addEventListener("pointerdown",e=>{if(!e.target.closest("#pop")&&e.target!==cv)hidePop()});
$("#bar").addEventListener("click",e=>{const b=e.target.closest(".tw");if(!b)return;sel=sel===b.dataset.k?null:b.dataset.k;bar();hud();if(sel)toast(`${TW[sel].n}: ${TW[sel].d}`)});
$("#go").onclick=()=>{if(G)startWave()};
$("#spd").onclick=()=>{spd=spd===1?2:spd===2?3:1;$("#spd").textContent=`${spd}x`};
$("#snd").onclick=()=>{sound=!sound;$("#snd").textContent=sound?"🔊":"🔈";try{localStorage.setItem("tdSnd",sound?"1":"0")}catch(e){}};$("#snd").textContent=sound?"🔊":"🔈";

/* ===== UI ===== */
function face2d(c,x,y,s,t,k){c.save();c.translate(x,y);
  c.fillStyle=t.face;c.beginPath();c.arc(0,s*.1,s*.42,0,7);c.fill();
  c.fillStyle=t.hat;c.beginPath();c.ellipse(0,-s*.18,s*.46,s*.22,0,Math.PI,0);c.fill();
  if(k==="ig"){c.beginPath();c.ellipse(0,-s*.14,s*.58,s*.12,0,0,7);c.fill();c.fillStyle="#C9772F";c.fillRect(-s*.3,-s*.2,s*.6,s*.06)}
  if(k==="kj"){c.fillStyle="#F1C24B";c.beginPath();c.arc(0,-s*.3,s*.08,0,7);c.fill()}
  if(k==="bg"){c.fillStyle="#D9C9FF";c.beginPath();c.arc(0,-s*.42,s*.08,0,7);c.fill()}
  if(k==="cj"){c.fillStyle="#FFE27A";c.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,r=i%2?s*.05:s*.12;c.lineTo(Math.cos(a)*r,-s*.28+Math.sin(a)*r)}c.fill()}
  c.fillStyle="#2E2A27";c.beginPath();c.arc(-s*.15,s*.12,s*.06,0,7);c.arc(s*.15,s*.12,s*.06,0,7);c.fill();
  if(t.glasses){c.strokeStyle="#2E2A27";c.lineWidth=s*.04;c.strokeRect(-s*.27,s*.04,s*.2,s*.15);c.strokeRect(s*.07,s*.04,s*.2,s*.15)}
  c.strokeStyle="#2E2A27";c.lineWidth=s*.05;c.lineCap="round";c.beginPath();c.arc(0,s*.24,s*.1,.2,Math.PI-.2);c.stroke();
  c.fillStyle="rgba(246,169,154,.6)";c.beginPath();c.arc(-s*.28,s*.25,s*.07,0,7);c.arc(s*.28,s*.25,s*.07,0,7);c.fill();c.restore()}
function iconTo(c,k){const x=c.getContext("2d"),W=c.width;const g=x.createLinearGradient(0,0,0,W);g.addColorStop(0,TW[k].col);g.addColorStop(1,"rgba(0,0,0,.25)");x.fillStyle=TW[k].col;x.beginPath();x.arc(W/2,W/2,W/2-2,0,7);x.fill();x.fillStyle=g;x.globalAlpha=.4;x.fill();x.globalAlpha=1;face2d(x,W/2,W/2+1,W*.8,TW[k],k)}
function hud(){if(!G)return;$("#hp").textContent="❤️ "+G.hp;$("#gd").textContent="🪙 "+G.gold;$("#wv").textContent=`🌊 ${G.wave}/${G.waves.length}`;
  const b=$("#go");const busy=G.spawn.length>0;b.disabled=busy||G.wave>=G.waves.length;b.textContent=G.wave>=G.waves.length?"마지막":busy?"진행 중":G.wave==0?"▶ 시작":"다음 ▶";b.style.opacity=b.disabled?.55:1;
  document.querySelectorAll(".tw").forEach(e=>e.classList.toggle("no",G.gold<TW[e.dataset.k].c))}
function bar(){$("#bar").innerHTML=Object.entries(TW).map(([k,d])=>`<button class="tw ${sel===k?"on":""}" data-k="${k}"><canvas width="68" height="68"></canvas>${d.n}<b>🪙${d.c}</b></button>`).join("");
  document.querySelectorAll(".tw canvas").forEach((c,i)=>iconTo(c,Object.keys(TW)[i]))}
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),1600)}
function crew(){return `<div class="crew">${Object.keys(TW).map(k=>`<canvas width="88" height="88" data-c="${k}"></canvas>`).join("")}</div>`}
function paintCrew(){document.querySelectorAll("canvas[data-c]").forEach(c=>iconTo(c,c.dataset.c))}
function menu(){paused=true;$("#ov").innerHTML=`<div class="box"><h1>동네 지킴이 디펜스</h1>${crew()}
  <p>벌레·말벌·두더지·까마귀 대장이 동네 카페로 몰려와요!<br>동료를 길 옆에 세워 카페를 지켜 주세요.</p>
  <div class="lv">${LEVELS.map((l,i)=>{const st=prog[i]||0,open=i==0||prog[i-1]>0;return `<button class="${open?"":"lock"}" data-lv="${i}" ${open?"":"disabled"}>${open?"":"🔒 "}${i+1}. ${l.name}<br>${"★".repeat(st)}${"☆".repeat(3-st)}</button>`}).join("")}</div>
  <button class="s" id="help">❓ 하는 방법</button></div>`;$("#ov").classList.remove("off");paintCrew()}
function help(){$("#ov").innerHTML=`<div class="box"><h1>하는 방법</h1><p>① 아래에서 동료를 고르고 <b>풀밭</b>을 눌러 세워요.<br>② <b>▶ 시작</b>을 누르면 적이 와요.<br>③ 적을 잡으면 🪙 동전! 세운 동료를 누르면 <b>강화·판매</b>.<br>④ 10웨이브를 막으면 승리, ❤️가 0이 되면 패배.</p>
  <p>🌾 일굼이: 느리게 · 🤓 대심이: 연사 · 🧭 키잡이: 범위<br>🗝 곳간이: 동전 보너스</p><button id="back">알겠어요</button></div>`}
function end(win){paused=true;const st=win?(G.hp>=18?3:G.hp>=10?2:1):0;if(win&&st>(prog[lvl]||0)){prog[lvl]=st;save()}if(win)sfx.win();
  $("#ov").innerHTML=`<div class="box"><div style="font-size:2.4rem">${win?"🏆":"🥲"}</div><h1>${win?"카페를 지켰어요!":"카페가 털렸어요…"}</h1>
  <div class="stars">${win?"★".repeat(st)+"☆".repeat(3-st):""}</div><p>${LEVELS[lvl].name} · 처치 ${G.kills} · 남은 ❤️ ${G.hp}</p>
  ${win&&lvl<LEVELS.length-1?`<button data-lv="${lvl+1}">다음 지역 ▶</button>`:""}<button class="s" data-lv="${lvl}">다시 하기</button><button class="s" id="home">지역 고르기</button><button class="s" id="share">친구에게 자랑하기</button></div>`;
  $("#ov").classList.remove("off")}
$("#ov").addEventListener("click",async e=>{const l=e.target.closest("[data-lv]");if(l&&!l.disabled){$("#ov").classList.add("off");newGame(+l.dataset.lv);return}
  if(e.target.closest("#help")){help();return}if(e.target.closest("#back")||e.target.closest("#home")){menu();return}
  if(e.target.closest("#share")){const t=`동네 지킴이 디펜스 ${LEVELS[lvl].name} 클리어! 너도 해 봐 🛡☕ ${location.href}`;try{if(navigator.share)await navigator.share({text:t});else{await navigator.clipboard.writeText(t);toast("복사했어요")}}catch(_){}}});

/* 시작 */
newGame(0);paused=true;menu();fit();$("#load").remove();requestAnimationFrame(loop);
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
</body></html>
