 peer.on("open",()=>{NET.mode="host";setSeats(0,[0]);roomUI();ov("#ovRoom");netMsg("")});
 peer.on("error",e=>{if(e.type==="unavailable-id"){peer.destroy();hostRoom()}else{netMsg(t("연결 오류: ","Error: ")+e.type)}});
 peer.on("connection",c=>{c.on("open",()=>{const free=[1,2,3].find(i=>!NET.humans.includes(i));if(free===undefined||state!=="title"){c.send({t:"full"});setTimeout(()=>c.close(),300);return}
   c.seat=free;NET.conns.push(c);NET.humans.push(free);setSeats(0,NET.humans);c.send({t:"hi",seat:free,code});NET.send({t:"seats",h:NET.humans});roomUI();SND.go()});
  c.on("data",m=>{if(m.t==="in")NET.inp[c.seat]=[m.i[0],m.i[1],!!m.i[2]];else if(m.t==="mb"){if(G&&G.id==="mbox"&&G.remote)G.remote(c.seat,m.n)}else if(m.t==="emo"){showEmo(c.seat,m.e);NET.send({t:"emo",s:c.seat,e:m.e})}});
  c.on("close",()=>{NET.conns=NET.conns.filter(x=>x!==c);NET.humans=NET.humans.filter(i=>i!==c.seat);delete NET.inp[c.seat];setSeats(0,NET.humans);NET.send({t:"seats",h:NET.humans});if(state==="title"||$("#ovRoom").classList.contains("on"))roomUI();say(ANAME[c.seat]+t(" 친구가 나갔어요"," left"),"#fff",1.5)})})}
function joinUI(){let code="";const c=$("#roomCard");const draw=()=>{c.innerHTML=`<div class="gname">${t("방 코드 입력","Enter room code")}</div><div class="code">${(code+"____").slice(0,4)}</div><div class="pad">${[1,2,3,4,5,6,7,8,9,"←",0,"OK"].map(k=>`<button data-k="${k}">${k}</button>`).join("")}</div><button class="btn sm" id="bRX">${t("뒤로","Back")}</button>`;
  c.querySelectorAll(".pad button").forEach(b=>b.onclick=()=>{const k=b.dataset.k;if(k==="←")code=code.slice(0,-1);else if(k==="OK"){if(code.length===4)joinRoom(code);return}else if(code.length<4)code+=k;draw();if(code.length===4)joinRoom(code)});$("#bRX").onclick=()=>ov("#ovTitle")};draw();ov("#ovRoom")}
function joinRoom(code){if(!needPeer())return;ac();netMsg(t("들어가는 중…","Joining…"));const peer=new Peer();NET.peer=peer;
 peer.on("error",e=>{netMsg(e.type==="peer-unavailable"?t("그 번호의 방이 없어요","No room with that code"):t("연결 오류: ","Error: ")+e.type)});
 peer.on("open",()=>{const c=peer.connect("pangpang-v1-"+code,{reliable:true});NET.host=c;
  c.on("data",m=>onGuest(m));c.on("close",()=>{if(NET.mode==="guest"){say(t("방이 끝났어요","Room closed"),"#FF6B6B",2);leaveRoom()}})})}
function onGuest(m){switch(m.t){
 case"full":netMsg(t("방이 꽉 찼거나 이미 시작했어요","Room full or already started"));break;
 case"hi":NET.mode="guest";NET.code=m.code;setSeats(m.seat,[0,m.seat]);roomUI();netMsg("");$("#emo").style.display="flex";break;
 case"seats":setSeats(NET.seat,m.h);if($("#ovRoom").classList.contains("on"))roomUI();break;
 case"round":if(round===0&&m.r===0)P.forEach(p=>p.pts=0);order=m.g.map(id=>GAMES.find(x=>x.id===id));round=m.r;srand(m.seed);NET.goOk=false;nextRound();break;
 case"skip":if(state==="intro"&&stT<introHold)stT=introHold;break;
 case"go":NET.goOk=true;if(state==="intro")stT=Math.max(stT,introHold+3);break;
 case"out":{const p=P[m.i];NET.applying=true;eliminate(p);NET.applying=false;break}
 case"fin":m.sc.forEach((v,i)=>P[i].score=v);finishRound(m.rk.map(i=>P[i]));break;
 case"end":endParty();break;
 case"emo":if(m.s!==NET.seat)showEmo(m.s,m.e);break;
 case"s":if(m.g&&G&&G.netIn&&state==="play")G.netIn(m.g);for(let i=0;i<4;i++){const p=P[i],a=m.p[i];if(!a)continue;const k=p.you?(Math.hypot(a[0]-p.x,a[1]-p.z)>1.2?.25:0):.35;
   p.x+=(a[0]-p.x)*k;p.z+=(a[1]-p.z)*k;if(!p.you){if(Math.abs(a[2]-p.y)>.6){p.y=a[2];p.vy=a[3]}p.ex=a[4];p.ez=a[5];NET.rin[i]=[a[6],a[7],!!a[8]];p.face=a[12]}
   if(a[9]&&!p.out){NET.applying=true;eliminate(p);NET.applying=false}p.score=a[10];p.pts=a[11]}break}}
function showEmo(i,e){popTxt(P[i],e,"#fff")}
$("#emo").querySelectorAll("button").forEach(b=>b.onclick=()=>{const e=b.textContent;showEmo(NET.seat,e);if(NET.mode==="host")NET.send({t:"emo",s:0,e});else NET.send({t:"emo",e})});
$("#bHost").textContent=t("친구랑 방 만들기","Create room");$("#bJoin").textContent=t("방 코드로 들어가기","Join with code");
$("#bHost").onclick=()=>{pickChar(0);hostRoom()};$("#bJoin").onclick=()=>{pickChar(0);joinUI()};
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("pp-sw.js").catch(()=>{});


/* ---------- 배경음악 (직접 만든 곡 · 웹오디오로 연주) ---------- */
const BGM=(()=>{let on=false,next=0,step=0,timer=null;const F=n=>440*Math.pow(2,(n-69)/12);
 const CH=[[60,64,67],[57,60,64],[53,57,60],[55,59,62]];
 const MEL=[72,0,76,79,76,0,74,72, 69,0,72,76,74,0,72,0, 65,0,69,72,74,72,69,0, 67,71,74,0,76,74,71,0];
 function note(f,t,d,type,v){const a=AC;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0008,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02)}
 function hat(t,v){const a=AC,n=a.sampleRate*.04,b=a.createBuffer(1,n,a.sampleRate),c=b.getChannelData(0);for(let i=0;i<n;i++)c[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource(),g=a.createGain(),f=a.createBiquadFilter();f.type="highpass";f.frequency.value=6000;s.buffer=b;g.gain.value=v;s.connect(f);f.connect(g);g.connect(a.destination);s.start(t)}
 function tick(){if(!AC||!on)return;const fast=state==="play",spb=60/(fast?138:104)/2;
  while(next<AC.currentTime+.15){const t=next,bar=Math.floor(step/8)%4,i=step%32,ch=CH[bar];
   if(!muted){const v=fast?1:.7;
    if(step%8===0)note(F(ch[0]-24),t,spb*3.5,"triangle",.11*v);if(step%8===4)note(F(ch[0]-12),t,spb*2,"triangle",.07*v);
    if(step%2===0)note(F(ch[(step/2)%3]),t,spb*1.2,"square",.018*v);
    const m=MEL[i];if(m&&(fast||i%2===0))note(F(m),t,spb*(fast?1.4:2.4),"sine",.05*v);
    if(fast&&step%2===1)hat(t,.025)}
   next+=spb;step++}}
 return{start(){if(on||!ac())return;on=true;next=AC.currentTime+.05;timer=setInterval(tick,40)},stop(){on=false;clearInterval(timer)}}})();
addEventListener("pointerdown",()=>BGM.start(),{once:true});addEventListener("keydown",()=>BGM.start(),{once:true});
/* ---------- 메인 루프 ---------- */
let FF=1;const ffB=$("#ff");ffB.onclick=()=>{FF=FF===1?1.5:FF===1.5?2:FF===2?4:1;ffB.textContent="⏩ ×"+FF};ffB.addEventListener("keydown",e=>e.stopPropagation());
let last=performance.now(),T=0;
function loop(now){const dt0=Math.min(.033,(now-last)/1000);let dt=dt0;if(HS>0&&state==="play"){HS-=dt0;dt=dt0*.05}last=now;T+=dt;stT+=dt;
 if(state==="title"){P.forEach((p,i)=>{const a=T*.6+i*1.57;p.x=Math.cos(a)*4;p.z=Math.sin(a)*4;p.vx=-Math.sin(a)*2.4;p.vz=Math.cos(a)*2.4;p.face=Math.atan2(p.vx,p.vz);if(p.grounded&&Math.random()<.01){p.vy=9;p.grounded=false}p.vy-=30*dt;p.y=Math.max(0,p.y+p.vy*dt);if(p.y===0){p.grounded=true;p.vy=0}})}
 else if(state==="intro"){const H=introHold,c=Math.ceil(H+3-stT);
  const left=Math.max(0,Math.ceil(H-stT));$("#iSkip").textContent=stT<H?t(`${left}초 뒤 시작 · 누르면 바로 시작`,`Starting in ${left}s · tap to start`):"";
  if(stT>=H&&$("#ovIntro").classList.contains("on"))ov(null);
  if(stT>=H&&c!==lastCount&&c>0){lastCount=c;SND.tick();say(String(c),"#FFE066",.9)}
  if(stT>=H+3&&!(NET.mode==="guest"&&!NET.goOk)){NET.goOk=false;state="play";GT=0;say(t("시작!","GO!"),"#9BE58A",.8);SND.go()}physics(dt)}
 else if(state==="play"){const me=P.find(p=>p.you);if(me&&me.out&&!G._aff&&!NET.mode){G._aff=1;FF=1.5;ffB.textContent="⏩ ×1.5";say(t("빨리 보기 ⏩","Fast forward ⏩"),"#9BE58A",1)}
  let nn=1;if(!NET.mode){window.__fa=(window.__fa||0)+FF;nn=Math.floor(window.__fa);window.__fa-=nn}for(let kk=0;kk<nn&&state==="play";kk++){GT+=dt;G.update(dt,GT);physics(dt);if(!NET.mode&&me&&me.out){G._dd=(G._dd||0)+dt}if(NET.mode!=="guest"&&(G.over(GT)||(G._dd>1.6))){say(t("끝!","FINISH!"),"#FFE066",1);finishRound()}}
  {const hb=$("#howBox");if(hb){if(state==="play"&&G){if(hb._g!==G.id){hb._g=G.id;hb.textContent=G.how.startsWith(G.em)?G.how:G.em+" "+G.how}hb.style.display="block"}else{hb.style.display="none";hb._g=null}}}
  if(state==="play"){const left=G.timed?Math.max(0,Math.ceil(G.len-GT)):null;$("#info").textContent=`${G.em} ${G.name}  ·  `+(G.timed?`⏱ ${left}`:t(`남은 친구 ${P.filter(p=>!p.out).length}`,`${P.filter(p=>!p.out).length} left`));
  if(G.timed&&left<=3&&left!==G._lt){G._lt=left;if(left>0){SND.tick();say(String(left),"#FF6B6B",.6)}}
  if(G.timed&&Math.floor(GT*4)!==G._ct){G._ct=Math.floor(GT*4);renderChips()}}}
 else if(state==="result"){physics(dt);if(NET.mode!=="guest"&&stT>3.6){round++;if(round<order.length)nextRound();else endParty()}}
 else if(state==="end"){P.forEach(p=>{p.face=Math.sin(T*2+p.id)*.4;if(Math.random()<.02&&p.vy===0){p.vy=7}const base=p.mesh.position.y;p.y=Math.max(0,p.y);})}
 ffB.style.display=(state==="play"&&!NET.mode)?"block":"none";if(state!=="play")$("#info").textContent=state==="title"?"":$("#info").textContent;
 animP(dt,T);upFX(dt);upPops(dt);upMeTag();upStage(dt,T);
 deco.children.forEach(b=>{b.position.y+=Math.sin(T*.6+b.userData.ph)*.004;if(b.userData.spin)b.rotation.y+=dt*1.2});deco.rotation.y+=dt*.02;
 shake=Math.max(0,shake-dt*1.4);bT-=dt;if(bT<=0)banner.classList.remove("on");
 NET.tick(dt);setCam(T);R3.render(scene,cam);requestAnimationFrame(loop)}
requestAnimationFrame(loop);
try{pickChar(Math.max(0,Math.min(3,+localStorage.getItem("ppChar")||0)))}catch(_){}
try{if(new URLSearchParams(location.search).get("auto"))setTimeout(()=>{try{startParty()}catch(_){}},700)}catch(_){}
window.__pp={get state(){return state},get P(){return P},get act(){return touchAct}};
})();
