<title>Party Pop! 3D · 팡팡 파티</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}

canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none;color:#fff}
#chips{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;gap:8px}
.chip{display:flex;align-items:center;gap:7px;background:rgba(20,10,50,.62);border:2px solid transparent;border-radius:14px;padding:5px 12px 5px 6px;min-width:112px}
.chip.you{border-color:#FFE066}
.chip .dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:15px}
.chip b{display:block;font-size:13px;line-height:1.1}.chip i{font-style:normal;font-weight:900;color:#FFE066;font-size:15px}
.chip.out{opacity:.4}
#info{position:absolute;top:66px;left:50%;transform:translateX(-50%);font-weight:800;font-size:15px;text-shadow:0 2px 6px rgba(0,0,0,.5);white-space:nowrap}
#banner{position:absolute;top:38%;left:50%;transform:translate(-50%,-50%);font-size:clamp(40px,9vw,96px);font-weight:900;color:#FFE066;-webkit-text-stroke:3px #2A1060;text-shadow:0 6px 0 #2A1060;opacity:0;transition:opacity .2s,transform .2s;white-space:nowrap}
#banner.on{opacity:1}
#hint{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);font-size:13px;font-weight:700;background:rgba(20,10,50,.5);padding:5px 12px;border-radius:10px;white-space:nowrap}

.sub{margin:12px 0 18px;font-size:16px;opacity:.9;font-weight:700}

.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #B25E00}

.rk .n{width:30px;font-size:22px}.rk .p{margin-left:auto;color:#FFE066}
.rk.you{outline:2px solid #FFE066}
#touch{position:fixed;inset:0;pointer-events:none;display:none}
#joy{position:absolute;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.3);display:none}

</style></head><body>
<div id="hud"><div id="chips"></div><div id="info"></div><div id="banner"></div><div id="hint"></div></div>
<div id="touch"><div id="joy"><div id="knob"></div></div><div id="act">JUMP</div></div>
<button id="mute">🔊</button>
<div class="ov on" id="ovTitle"><div><div class="ttl" id="tTitle">팡팡 파티!</div><div class="sub" id="tSub"></div><button class="btn" id="bPlay">PLAY</button><div class="sub" id="tBest" style="margin-top:14px;font-size:14px"></div></div></div>
<div class="ov" id="ovIntro"><div class="card"><div class="gem" id="iEm"></div><div class="gname" id="iName"></div><div class="how" id="iHow"></div><div class="keys" id="iKeys"></div><div class="sub" id="iRound" style="margin:10px 0 0"></div></div></div>

<script src="three.min.js"></script>
<script>
(()=>{"use strict";
const KO=/^ko/i.test(navigator.language||"");const t=(k,e)=>KO?k:e;
const $=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const TOUCH=matchMedia("(pointer:coarse)").matches||"ontouchstart" in window;

/* ---------- 소리 ---------- */
let AC=null,muted=false;try{muted=localStorage.getItem("pp3m")==="1"}catch(_){}
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(_){}}if(AC&&AC.state==="suspended")AC.resume();return AC}
function tone(f,d,type,v,slide){const a=ac();if(!a||muted)return;const o=a.createOscillator(),g=a.createGain();o.type=type||"sine";o.frequency.setValueAtTime(f,a.currentTime);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),a.currentTime+d);g.gain.setValueAtTime(v||.15,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d)}

const SND={jump:()=>tone(420,.18,"square",.07,820),bump:()=>{tone(160,.15,"triangle",.2,70);noise(.08,.15)},coin:()=>{tone(880,.08,"square",.07);setTimeout(()=>tone(1320,.12,"square",.07),60)},
  boom:()=>{noise(.5,.5);tone(110,.4,"sawtooth",.15,40)},out:()=>tone(500,.5,"sawtooth",.12,80),tick:()=>tone(660,.08,"square",.08),go:()=>{tone(523,.1,"square",.1);setTimeout(()=>tone(784,.25,"square",.1),100)},
  win:()=>[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.25,"square",.09),i*120)),dash:()=>noise(.15,.18),crack:()=>tone(220,.08,"triangle",.08,140)};
$("#mute").onclick=()=>{muted=!muted;$("#mute").textContent=muted?"🔇":"🔊";try{localStorage.setItem("pp3m",muted?"1":"0")}catch(_){}};$("#mute").textContent=muted?"🔇":"🔊";

/* ---------- 3D 기본 ---------- */
const R3=new THREE.WebGLRenderer({antialias:true});R3.setPixelRatio(Math.min(2,devicePixelRatio||1));R3.shadowMap.enabled=true;R3.shadowMap.type=THREE.PCFSoftShadowMap;
R3.outputColorSpace=THREE.SRGBColorSpace;document.body.prepend(R3.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color("#5B3FB0");scene.fog=new THREE.Fog("#5B3FB0",34,70);
const cam=new THREE.PerspectiveCamera(45,1,.1,200);
scene.add(new THREE.HemisphereLight("#FFF4E0","#4A2C8A",1.1));
const sun=new THREE.DirectionalLight("#FFFFFF",1.6);sun.position.set(8,20,10);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-16,right:16,top:16,bottom:-16,near:1,far:60});sun.shadow.bias=-.0008;scene.add(sun);
const gm=new THREE.DataTexture(new Uint8Array([110,110,110,255,185,185,185,255,255,255,255,255]),3,1,THREE.RGBAFormat);gm.minFilter=gm.magFilter=THREE.NearestFilter;gm.needsUpdate=true;

/* 배경: 떠다니는 풍선 구름 */
const deco=new THREE.Group();scene.add(deco);
for(let i=0;i<26;i++){const a=i/26*6.283,r=rnd(24,34),s=rnd(1.2,3);const b=mesh(new THREE.SphereGeometry(s,16,12),pick(["#FF7AA8","#7AD9FF","#FFD86B","#9BE58A","#C59BFF"]));b.position.set(Math.cos(a)*r,rnd(-14,-4),Math.sin(a)*r);b.userData.ph=rnd(0,6);deco.add(b)}
function resize(){const w=innerWidth,h=innerHeight;R3.setSize(w,h);cam.aspect=w/h;cam.updateProjectionMatrix()}addEventListener("resize",resize);resize();

/* ---------- 캐릭터 ---------- */
const PL=[{n:t("나","You"),c:"#FF5D8F",e:0,em:"😀"},{n:t("토토","Bunny"),c:"#4CC38A",e:1,em:"🐰"},{n:t("곰곰","Bear"),c:"#4BA3FF",e:2,em:"🐻"},{n:t("냥냥","Kitty"),c:"#FFB020",e:3,em:"🐱"}];
function makeAnimal(col,ears,you){const g=new THREE.Group(),b=new THREE.Group();g.add(b);
  const body=mesh(new THREE.SphereGeometry(.72,28,20),col,true);body.scale.set(1,.93,1);body.position.y=.72;b.add(body);
  const belly=mesh(new THREE.SphereGeometry(.46,20,14),"#FFF6EA");belly.scale.set(1,1,.45);belly.position.set(0,.6,.5);b.add(belly);
  for(const s of[-1,1]){const w=mesh(new THREE.SphereGeometry(.15,14,10),"#FFFFFF");w.position.set(s*.25,.9,.6);b.add(w);
    const p=new THREE.Mesh(new THREE.SphereGeometry(.085,12,8),new THREE.MeshBasicMaterial({color:"#22183A"}));p.position.set(s*.25,.9,.72);b.add(p);
    const h=new THREE.Mesh(new THREE.SphereGeometry(.03,8,6),new THREE.MeshBasicMaterial({color:"#fff"}));h.position.set(s*.25+.03,.94,.79);b.add(h);
    const ck=new THREE.Mesh(new THREE.SphereGeometry(.1,10,8),new THREE.MeshBasicMaterial({color:"#FF9BB5",transparent:true,opacity:.75}));ck.scale.set(1,.6,.4);ck.position.set(s*.45,.7,.52);b.add(ck);
    const ft=mesh(new THREE.SphereGeometry(.2,12,8),col,true);ft.scale.set(1,.6,1.3);ft.position.set(s*.3,.1,.1);b.add(ft);
    const ar=mesh(new THREE.SphereGeometry(.16,12,8),col,true);ar.position.set(s*.72,.62,.05);b.add(ar);
    if(ears===1){const e=mesh(new THREE.SphereGeometry(.17,14,10),col,true);e.scale.set(1,3,.75);e.position.set(s*.26,1.65,-.05);e.rotation.z=-s*.15;b.add(e);const ei=mesh(new THREE.SphereGeometry(.09,10,8),"#FFC2D1");ei.scale.set(1,3.6,.5);ei.position.set(s*.26,1.65,.06);ei.rotation.z=-s*.15;b.add(ei)}
    if(ears===2){const e=mesh(new THREE.SphereGeometry(.24,14,10),col,true);e.position.set(s*.48,1.28,-.05);b.add(e);const ei=mesh(new THREE.SphereGeometry(.12,10,8),"#FFC2D1");ei.scale.set(1,1,.5);ei.position.set(s*.48,1.28,.12);b.add(ei)}
    if(ears===3){const e=mesh(new THREE.ConeGeometry(.25,.5,4),col,true);e.position.set(s*.38,1.4,0);e.rotation.z=-s*.35;b.add(e);const ei=mesh(new THREE.ConeGeometry(.12,.3,4),"#FFC2D1");ei.position.set(s*.37,1.38,.1);ei.rotation.z=-s*.35;b.add(ei)}}
  if(ears===0){const tuft=mesh(new THREE.ConeGeometry(.16,.45,8),col,true);tuft.position.set(0,1.55,0);tuft.rotation.z=.4;b.add(tuft);const tf=mesh(new THREE.SphereGeometry(.12,10,8),"#FFE066",true);tf.position.set(.16,1.78,0);b.add(tf)}
  const mo=new THREE.Mesh(new THREE.TorusGeometry(.13,.035,8,16,Math.PI),new THREE.MeshBasicMaterial({color:"#22183A"}));mo.rotation.z=Math.PI;mo.position.set(0,.76,.7);b.add(mo);
  const ring=new THREE.Mesh(new THREE.RingGeometry(.85,1.02,32),new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:.85}));ring.rotation.x=-Math.PI/2;ring.position.y=.03;g.add(ring);
  if(you){const ar=new THREE.Mesh(new THREE.ConeGeometry(.25,.45,4),new THREE.MeshBasicMaterial({color:"#FFE066"}));ar.rotation.x=Math.PI;ar.position.y=2.35;g.add(ar);g.userData.arrow=ar}
  g.userData.b=b;g.userData.ring=ring;return g}
let P=PL.map((d,i)=>({id:i,name:d.n,col:d.c,em:d.em,you:i===0,ai:i!==0,skill:[0,.72,.8,.88][i],pts:0,mesh:null}));
P.forEach(p=>{p.mesh=makeAnimal(p.col,PL[p.id].e,p.you);scene.add(p.mesh)});

/* ---------- 이펙트 ---------- */
const FX=[],fxGeo=new THREE.SphereGeometry(.12,6,5),fxBox=new THREE.BoxGeometry(.18,.18,.04);
function burst(x,y,z,col,n,sp,conf){for(let i=0;i<n;i++){const m=new THREE.Mesh(conf?fxBox:fxGeo,new THREE.MeshBasicMaterial({color:col||pick(["#FFE066","#FF7AA8","#7AD9FF","#9BE58A","#fff"]),transparent:true}));m.position.set(x,y,z);
  const a=rnd(0,6.283),u=rnd(.2,1);scene.add(m);FX.push({m,vx:Math.cos(a)*u*(sp||6),vy:rnd(3,9)*(sp?sp/6:1),vz:Math.sin(a)*u*(sp||6),life:rnd(.6,1.2),max:1.2,rs:conf?rnd(-9,9):0})}}
function confetti(n){for(let i=0;i<n;i++){const m=new THREE.Mesh(fxBox,new THREE.MeshBasicMaterial({color:pick(["#FFE066","#FF7AA8","#7AD9FF","#9BE58A","#C59BFF","#fff"]),transparent:true,side:THREE.DoubleSide}));m.position.set(rnd(-10,10),rnd(10,16),rnd(-6,8));scene.add(m);FX.push({m,vx:rnd(-1,1),vy:rnd(-2,0),vz:rnd(-1,1),life:rnd(3,5),max:5,rs:rnd(-8,8),g:3})}}
function upFX(dt){for(let i=FX.length-1;i>=0;i--){const f=FX[i];f.life-=dt;f.vy-=(f.g||18)*dt;f.m.position.x+=f.vx*dt;f.m.position.y+=f.vy*dt;f.m.position.z+=f.vz*dt;if(f.rs){f.m.rotation.x+=f.rs*dt;f.m.rotation.y+=f.rs*dt*.7}
  f.m.material.opacity=clamp(f.life/f.max*2,0,1);if(f.life<=0){scene.remove(f.m);f.m.material.dispose();FX.splice(i,1)}}}
let shake=0;
const banner=$("#banner");let bT=0;function say(s,col,d){banner.textContent=s;banner.style.color=col||"#FFE066";banner.classList.add("on");bT=d||1}

/* ---------- 입력 ---------- */
const keys={};addEventListener("keydown",e=>{keys[e.code]=1;if(["Space","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.code))e.preventDefault();if(e.code==="KeyM")$("#mute").click()});addEventListener("keyup",e=>{keys[e.code]=0});
addEventListener("blur",()=>{for(const k in keys)keys[k]=0});
let joy={on:false,id:null,x:0,y:0,cx:0,cy:0},touchAct=false;
if(TOUCH){$("#touch").style.display="block";$("#hint").style.display="none"}
const J=$("#joy"),K=$("#knob");
addEventListener("pointerdown",e=>{if(!TOUCH||e.pointerType==="mouse")return;if(e.target.closest("#act,.btn,#mute"))return;if(e.clientX<innerWidth*.6&&!joy.on){joy={on:true,id:e.pointerId,x:0,y:0,cx:e.clientX,cy:e.clientY};J.style.display="block";J.style.left=(e.clientX-60)+"px";J.style.top=(e.clientY-60)+"px"}});
addEventListener("pointermove",e=>{if(!joy.on||e.pointerId!==joy.id)return;let dx=e.clientX-joy.cx,dy=e.clientY-joy.cy;const d=Math.hypot(dx,dy),m=50;if(d>m){dx*=m/d;dy*=m/d}joy.x=dx/m;joy.y=dy/m;K.style.left=(35+dx)+"px";K.style.top=(35+dy)+"px"});
const jEnd=e=>{if(e.pointerId!==joy.id)return;joy.on=false;joy.x=joy.y=0;J.style.display="none";K.style.left=K.style.top="35px"};addEventListener("pointerup",jEnd);addEventListener("pointercancel",jEnd);
const actB=$("#act");actB.addEventListener("pointerdown",e=>{e.preventDefault();touchAct=true;ac()});["pointerup","pointercancel","pointerleave"].forEach(ev=>actB.addEventListener(ev,()=>touchAct=false));
function myInput(){let x=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0),z=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0);
  if(joy.on){x=joy.x;z=joy.y}const d=Math.hypot(x,z);if(d>1){x/=d;z/=d}return [x,z,!!(keys.Space||keys.KeyJ||keys.ShiftLeft||keys.ShiftRight||keys.Enter||touchAct)]}

/* ---------- 미니게임들 ---------- */
const arena=new THREE.Group();scene.add(arena);
function clearArena(){while(arena.children.length){const c=arena.children.pop();c.traverse(o=>{if(o.geometry)o.geometry.dispose()})}}
function spawnRing(r,off){P.forEach((p,i)=>{const a=(i/4)*6.283+(off||Math.PI/2);place(p,Math.cos(a)*r,Math.sin(a)*r)})}
function place(p,x,z){Object.assign(p,{x,z,y:0,vx:0,vz:0,ex:0,ez:0,vy:0,out:false,falling:false,ko:false,grounded:true,stun:0,cd:0,dashT:0,score:0,face:Math.atan2(-x,-z),aiT:0,tx:x,tz:z,jumpWant:0});p.mesh.visible=true;p.mesh.position.set(x,0,z);p.mesh.userData.b.scale.set(1,1,1)}
function platformDisc(R,col,edge){const g=new THREE.Group();const top=mesh(new THREE.CylinderGeometry(R,R,1,64),col,false,true);top.position.y=-.5;g.add(top);
  const rim=mesh(new THREE.TorusGeometry(R,.18,10,64),edge||"#FFE066");rim.rotation.x=Math.PI/2;rim.position.y=0;g.add(rim);
  const under=mesh(new THREE.CylinderGeometry(R*.95,R*.4,3,48),"#3A2475");under.position.y=-2.5;g.add(under);return g}
function stripes(R,n,col){const g=new THREE.Group();for(let i=0;i<n;i++){const s=new THREE.Mesh(new THREE.CircleGeometry(R,48,i*6.283/n,6.283/n/2),M(col));s.rotation.x=-Math.PI/2;s.position.y=.01;s.receiveShadow=true;g.add(s)}return g}
const GAMES=[
 {id:"sumo",em:"🥊",name:t("밀어내기 왕","Bump King"),how:t("부딪혀서 다른 친구를 떨어뜨려요! 바닥이 점점 작아져요","Bump others off! The arena keeps shrinking"),act:"dash",actLabel:t("돌진","DASH"),keys:t("이동: WASD/방향키 · 돌진: 스페이스","Move: WASD/Arrows · Dash: Space"),len:45,
  setup(){this.R=9;this.d=platformDisc(9,"#8E6CEB");this.d.add(stripes(9,12,"#A58BF5"));arena.add(this.d);spawnRing(5.5)},
  update(dt,T){this.R=Math.max(3.8,9-Math.max(0,T-4)*.16);const s=this.R/9;this.d.scale.set(s,1,s)},
  ground(p){return Math.hypot(p.x,p.z)<this.R+.15},
  ai(p,dt){let best=null,bd=1e9;for(const q of P)if(q!==p&&!q.out&&!q.falling){const d=Math.hypot(q.x-p.x,q.z-p.z);if(d<bd){bd=d;best=q}}
   let dx=0,dz=0,act=false;if(best){dx=best.x-p.x;dz=best.z-p.z;const l=Math.hypot(dx,dz)||1;dx/=l;dz/=l;act=bd<3.2&&Math.random()<p.skill*.1}
   const r=Math.hypot(p.x,p.z);if(r>this.R-2.2){const w=clamp((r-(this.R-2.2))/1.5,0,1)*(.6+p.skill*.5);dx=dx*(1-w)-p.x/r*w*1.6;dz=dz*(1-w)-p.z/r*w*1.6}
   return [dx,dz,act]},

function animP(dt,T){for(const p of P){if(!p.mesh.visible)continue;const m=p.mesh,b=m.userData.b;m.position.set(p.x,p.y,p.z);
  let dr=p.face-m.rotation.y;while(dr>Math.PI)dr-=6.283;while(dr<-Math.PI)dr+=6.283;m.rotation.y+=dr*Math.min(1,dt*12);
  const spd=Math.hypot(p.vx,p.vz);b.position.y=p.grounded?Math.abs(Math.sin(T*14+p.id))*.14*clamp(spd/6,0,1):0;
  p.squash=Math.max(0,(p.squash||0)-dt);const s=p.squash>0?Math.sin(p.squash/.25*Math.PI)*.25:0;const air=!p.grounded&&!p.falling?.08:0;b.scale.set(1+s,1-s+air,1+s);
  b.rotation.x=p.stun>0?Math.sin(T*25)*.2:(p.falling||p.ko?b.rotation.x+dt*6:clamp(spd/6,0,1)*.12);if(!p.falling&&!p.ko&&p.stun<=0)b.rotation.x=clamp(spd/6,0,1)*.12;
  m.userData.ring.visible=p.grounded&&!p.falling;if(m.userData.arrow){m.userData.arrow.position.y=2.35+Math.sin(T*5)*.15;m.userData.arrow.rotation.y+=dt*2}}}

/* ---------- 화면 (HUD) ---------- */
function renderChips(){$("#chips").innerHTML=P.map(p=>`<div class="chip${p.you?" you":""}${p.out&&state==="play"?" out":""}"><span class="dot" style="background:${p.col}">${p.em}</span><span><b>${p.name}</b><i>${p.pts}</i>${state==="play"&&G&&G.timed?` <small style="font-weight:800">⭐${p.score}</small>`:""}</span></div>`).join("")}
const ov=id=>{["#ovTitle","#ovIntro","#ovRes","#ovEnd"].forEach(x=>$(x).classList.toggle("on",x===id))};
function setCam(T){const base=state==="end"?[Math.sin(T*.3)*9,7,13]:[0,17,17];cam.position.set(base[0]+(shake>0?rnd(-shake,shake):0),base[1]+(shake>0?rnd(-shake,shake):0),base[2]);cam.lookAt(0,state==="end"?1.5:-1.2,state==="end"?0:1.2)}
function startParty(){ac();P.forEach(p=>p.pts=0);order=shuffle(GAMES.slice()).slice(0,5);round=0;nextRound()}
function nextRound(){G=order[round];G.outs=[];clearArena();FX.splice(0).forEach(f=>scene.remove(f.m));G.setup();GT=0;state="intro";stT=0;lastCount=4;
 $("#iEm").textContent=G.em;$("#iName").textContent=G.name;$("#iHow").textContent=G.how;$("#iKeys").textContent=TOUCH?t("왼쪽 드래그로 이동 · 오른쪽 버튼: ","Drag left side to move · Button: ")+G.actLabel:G.keys;
 $("#iRound").textContent=t(`라운드 ${round+1} / ${order.length}`,`ROUND ${round+1} / ${order.length}`);$("#act").textContent=G.actLabel;$("#hint").textContent=G.keys;ov("#ovIntro");renderChips();SND.go()}
function finishRound(){state="result";stT=0;const R=G.rank(),pts=[5,3,1,0];R.forEach((p,i)=>p.pts+=pts[i]);
 const me=R.findIndex(p=>p.you);if(me===0){SND.win();confetti(60)}
 $("#rTitle").textContent=me===0?t("1등! 🎉","1st PLACE! 🎉"):t(`${me+1}등`,`${["1st","2nd","3rd","4th"][me]} place`);
 $("#rList").innerHTML=R.map((p,i)=>`<div class="rk${p.you?" you":""}"><span class="n">${["🥇","🥈","🥉","4"][i]}</span><span>${p.em} ${p.name}${G.timed?` · ⭐${p.score}`:""}</span><span class="p">+${pts[i]}</span></div>`).join("");
 setTimeout(()=>{if(state==="result")ov("#ovRes")},700);renderChips()}
function endParty(){state="end";stT=0;clearArena();const R=[...P].sort((a,b)=>b.pts-a.pts);
 const pod=[[0,2.2,"#FFD23F"],[-2.6,1.4,"#C9D3E6"],[2.6,.8,"#E0A372"],[5.2,.3,"#8E7BD1"]];
 R.forEach((p,i)=>{const[x,h,c]=pod[i];const b=mesh(new THREE.BoxGeometry(2.3,h,2.3),c,true,true);b.position.set(x,h/2-.01,0);arena.add(b);place(p,x,0);p.y=h;p.face=0;p.mesh.position.set(x,h,0)});
 const fl=mesh(new THREE.CylinderGeometry(12,12,.4,48),"#8E6CEB",false,true);fl.position.y=-.2;arena.add(fl);
 const win=R[0].you;$("#eTitle").textContent=win?t("파티 챔피언! 👑","PARTY CHAMPION! 👑"):t(`${R[0].em} ${R[0].name} 우승!`,`${R[0].em} ${R[0].name} WINS!`);
 $("#eList").innerHTML=R.map((p,i)=>`<div class="rk${p.you?" you":""}" style="font-size:15px;padding:6px 12px"><span class="n">${["🥇","🥈","🥉","4"][i]}</span><span>${p.em} ${p.name}</span><span class="p">${p.pts}</span></div>`).join("");
 $("#bAgain").textContent=t("한 판 더!","PLAY AGAIN");ov("#ovEnd");confetti(120);SND.win();
 try{const me=P[0].pts,best=+(localStorage.getItem("pp3best")||0);if(me>best)localStorage.setItem("pp3best",String(me))}catch(_){}renderChips()}
$("#bPlay").onclick=startParty;$("#bAgain").onclick=startParty;
$("#tTitle").textContent=t("팡팡 파티!","Party Pop!");$("#tSub").textContent=t("동물 친구들과 미니게임 대결! 5판 중 최고 점수를 노려요","Mini-game battle with animal friends! Win the most points in 5 rounds");$("#bPlay").textContent=t("플레이!","PLAY!");
try{const b=+(localStorage.getItem("pp3best")||0);if(b)$("#tBest").textContent=t("내 최고 점수: ","Your best: ")+b}catch(_){}
/* 타이틀 화면: 캐릭터들이 뛰어노는 모습 */
clearArena();{const fl=platformDisc(9,"#8E6CEB");fl.add(stripes(9,12,"#A58BF5"));arena.add(fl)}spawnRing(3.5);G={ground:()=>true,act:"jump",outs:[]};
renderChips();

/* ---------- 메인 루프 ---------- */
let last=performance.now(),T=0;
function loop(now){const dt=Math.min(.033,(now-last)/1000);last=now;T+=dt;stT+=dt;
 if(state==="title"){P.forEach((p,i)=>{const a=T*.6+i*1.57;p.x=Math.cos(a)*4;p.z=Math.sin(a)*4;p.vx=-Math.sin(a)*2.4;p.vz=Math.cos(a)*2.4;p.face=Math.atan2(p.vx,p.vz);if(p.grounded&&Math.random()<.01){p.vy=9;p.grounded=false}p.vy-=30*dt;p.y=Math.max(0,p.y+p.vy*dt);if(p.y===0){p.grounded=true;p.vy=0}})}
 else if(state==="intro"){const c=Math.ceil(3.2-stT);if(stT>.4&&c!==lastCount&&c>0){lastCount=c;SND.tick();if(stT>1.2)ov(null),say(String(c),"#FFE066",.9)}
  if(stT>1.2&&$("#ovIntro").classList.contains("on"))ov(null);
  if(stT>=3.2){state="play";GT=0;say(t("시작!","GO!"),"#9BE58A",.8);SND.go()}physics(dt)}
 else if(state==="play"){GT+=dt;G.update(dt,GT);physics(dt);
  const left=G.timed?Math.max(0,Math.ceil(G.len-GT)):null;$("#info").textContent=`${G.em} ${G.name}  ·  `+(G.timed?`⏱ ${left}`:t(`남은 친구 ${P.filter(p=>!p.out).length}`,`${P.filter(p=>!p.out).length} left`));
  if(G.timed&&left<=3&&left!==G._lt){G._lt=left;if(left>0){SND.tick();say(String(left),"#FF6B6B",.6)}}
  if(G.timed&&Math.floor(GT*4)!==G._ct){G._ct=Math.floor(GT*4);renderChips()}
  if(G.over(GT)){say(t("끝!","FINISH!"),"#FFE066",1);finishRound()}}
 else if(state==="result"){physics(dt);if(stT>3.6){round++;if(round<order.length)nextRound();else endParty()}}
 else if(state==="end"){P.forEach(p=>{p.face=Math.sin(T*2+p.id)*.4;if(Math.random()<.02&&p.vy===0){p.vy=7}const base=p.mesh.position.y;p.y=Math.max(0,p.y);})}
 if(state!=="play")$("#info").textContent=state==="title"?"":$("#info").textContent;
 animP(dt,T);upFX(dt);upPops(dt);
 deco.children.forEach(b=>{b.position.y+=Math.sin(T*.6+b.userData.ph)*.004});deco.rotation.y+=dt*.02;
 shake=Math.max(0,shake-dt*1.4);bT-=dt;if(bT<=0)banner.classList.remove("on");
 setCam(T);R3.render(scene,cam);requestAnimationFrame(loop)}
requestAnimationFrame(loop);
})();
</script>
</body></html>
